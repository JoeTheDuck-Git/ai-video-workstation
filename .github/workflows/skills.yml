name: Skills checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install numpy matplotlib Pillow opencc-python-reimplemented jieba
      - run: bash -n install.sh scripts/verify.sh
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/caption-doctor/tests -v
      - run: python -m unittest discover -s skills/video-delivery-qc/tests -v
      - run: python -m unittest discover -s skills/spoken-edit-review/tests -v
      - run: python -m unittest discover -s docs/reference-editing-lab/tests -v
