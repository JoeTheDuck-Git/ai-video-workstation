<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Pastel Code 粉彩程式・終端機步驟卡 — Tacky Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#f2efe7;--card:#fbf9f3;--ink:#3d3629;--soft:#9a917e;
        --coral:#d97757;--sage:#a9c3a2;--sagedeep:#7fa578;--sky:#a9c4de;
        --butter:#f0d494;--rule:#e5dfd0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#e9e5da;overflow:hidden}
  #fit{position:absolute}
  #stage{position:relative;overflow:hidden;background:var(--ivory)}
  .landscape #stage{width:1920px;height:1080px}
  .portrait  #stage{width:1080px;height:1920px}
  #camera{position:absolute;inset:0;will-change:transform}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
  #blobA{width:780px;height:780px;background:var(--sky);top:-240px;right:-180px;
    animation:driftA 27s ease-in-out infinite alternate}
  #blobB{width:660px;height:660px;background:var(--butter);bottom:-260px;left:-140px;
    animation:driftB 31s ease-in-out infinite alternate}
  @keyframes driftA{to{transform:translate(-80px,60px) scale(1.07)}}
  @keyframes driftB{to{transform:translate(70px,-60px) scale(1.05)}}

  /* ---------- serif headline above the terminal ---------- */
  #title{position:absolute;left:50%;transform:translateX(-50%);z-index:4;opacity:0;
    font-family:'Noto Serif TC',serif;font-weight:900;color:var(--ink);white-space:nowrap}
  .landscape #title{top:118px;font-size:74px}
  .portrait  #title{top:250px;font-size:58px}
  #title.on{animation:floatUp .8s cubic-bezier(.16,.7,.2,1) forwards}
  @keyframes floatUp{0%{opacity:0;transform:translateX(-50%) translateY(.35em);filter:blur(5px)}
    100%{opacity:1;transform:translateX(-50%) translateY(0);filter:blur(0)}}

  /* ---------- terminal card ---------- */
  #term{position:absolute;z-index:4;background:var(--card);border-radius:28px;
    border:1.5px solid var(--rule);opacity:0;
    box-shadow:0 26px 80px rgba(61,54,41,.14)}
  .landscape #term{left:50%;top:262px;transform:translateX(-50%);width:1160px;
    padding:0 0 44px}
  .portrait  #term{left:50%;top:420px;transform:translateX(-50%);width:880px;
    padding:0 0 40px}
  #term.on{animation:cardUp .7s cubic-bezier(.16,.8,.2,1) forwards}
  @keyframes cardUp{0%{opacity:0;transform:translateX(-50%) translateY(46px)}
    100%{opacity:1;transform:translateX(-50%) translateY(0)}}
  #thead{display:flex;align-items:center;gap:16px;padding:26px 36px;
    border-bottom:1.5px solid var(--rule)}
  #thead span.d{width:20px;height:20px;border-radius:50%}
  #thead span.d:nth-child(1){background:#e8a49c}
  #thead span.d:nth-child(2){background:var(--butter)}
  #thead span.d:nth-child(3){background:var(--sage)}
  #thead .tt{margin-left:16px;font-family:'Courier Prime',monospace;color:var(--soft);
    font-size:27px;letter-spacing:.04em}
  #steps{padding:14px 52px 0}
  .srow{opacity:0;transition:opacity .4s;margin-top:26px}
  .srow.on{opacity:1}
  .cmdline{font-family:'Courier Prime','Noto Sans TC',monospace;color:var(--ink);
    white-space:nowrap}
  .landscape .cmdline{font-size:40px}
  .portrait  .cmdline{font-size:34px}
  .cmdline .ps{color:var(--coral);font-weight:700;margin-right:20px}
  .cmdline .cursor{display:inline-block;width:.5em;height:.9em;background:var(--coral);
    vertical-align:-.08em;animation:blink .75s steps(1) infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  .done{font-family:'Courier Prime','Noto Sans TC',monospace;color:var(--sagedeep);
    margin:10px 0 0 52px;opacity:0;transition:opacity .5s;white-space:nowrap}
  .landscape .done{font-size:31px}.portrait .done{font-size:27px}
  .done.on{opacity:.95}
  .srow.focus .cmdline{color:var(--coral);font-weight:700}
  .srow.focus .done{color:var(--coral)}
  .srow .sparkslot{display:inline-block;margin-left:16px;color:var(--coral);opacity:0;
    transform:scale(.2) rotate(-40deg)}
  .srow .sparkslot.on{animation:sparkIn .6s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes sparkIn{70%{opacity:1;transform:scale(1.15) rotate(8deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}}

  #status{position:absolute;z-index:5;font-family:'Courier Prime',monospace;
    color:var(--soft);letter-spacing:.05em;opacity:0;transition:opacity .8s}
  .landscape #status{bottom:64px;right:84px;font-size:26px}
  .portrait  #status{bottom:74px;right:64px;font-size:23px}
  #status.on{opacity:.9}
  #cd{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--ivory)}
  #cd span{font-family:'Noto Serif TC';font-weight:900;font-size:320px;color:var(--ink)}
  #cues{position:absolute;right:24px;top:24px;z-index:21;display:none;background:rgba(61,54,41,.94);
    color:var(--ivory);font-family:'Courier Prime',monospace;font-size:15px;line-height:1.75;
    padding:14px 18px;max-height:70%;overflow:auto;border-radius:14px}
  .outro #camera{transition:transform 1.1s cubic-bezier(.4,0,.6,.5),opacity 1s .1s;
    transform:translateY(-40px) scale(1.015);opacity:0}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="camera">
    <div class="blob" id="blobA"></div><div class="blob" id="blobB"></div>
    <div id="title"></div>
    <div id="term">
      <div id="thead"><span class="d"></span><span class="d"></span><span class="d"></span>
        <span class="tt"></span></div>
      <div id="steps"></div>
    </div>
    <div id="status"></div>
  </div>
</div></div>

<script>
/* ============================================================
   CONFIG — Pastel Code 粉彩程式・終端機步驟卡.
   A method/framework as terminal commands: each step's `cmd`
   types on after the coral prompt, pauses, then its `done` line
   confirms in sage (✓ …). ONE step may have focus:true — it
   runs in coral and earns a ✳ instead of just a checkmark.
   3–5 steps. Airy: nothing slams, the rhythm is the typing.
   ============================================================ */
const CONFIG = {
  orientation: "landscape",
  title: "把「想拍片」變成系統",
  termTitle: "daily-routine.sh",
  steps: [
    {cmd:"固定時段 --每天 20:00", done:"✓ 大腦不再需要動力，只需要時鐘"},
    {cmd:"開拍 --before-ready", done:"完美是拖延的偽裝", focus:true},
    {cmd:"發布 && 睡覺", done:"✓ 數據明天再看"}
  ],
  status: "bash ・ 每天執行",
  timing: { start: 1.3, typeChar: 0.055, donePause: 0.5, stepPause: 0.55 }
};
/* ============================================================ */
const $=q=>document.querySelector(q);
const stagePx=()=>CONFIG.orientation==="portrait"?[1080,1920]:[1920,1080];
document.body.parentElement.className=CONFIG.orientation;
function fit(){const[W,H]=stagePx();const s=Math.min(innerWidth/W,innerHeight/H);
  $("#fit").style.cssText=`position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;`+
  `transform:translate(-50%,-50%) scale(${s});`;}
addEventListener("resize",fit);fit();
const CUES=[];const cue=(t,l)=>CUES.push([t,l]);
(function(){const st=document.getElementById("stage");
 const cd=document.createElement("div");cd.id="cd";cd.innerHTML="<span></span>";st.appendChild(cd);
 const cp=document.createElement("div");cp.id="cues";st.appendChild(cp);
 addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){let n=3;cd.style.display="flex";
    const s=cd.querySelector("span");s.textContent=n;
    const iv=setInterval(()=>{n--;if(n<1){clearInterval(iv);location.reload();}else s.textContent=n;},700);}
  if(e.key==="o"||e.key==="O"){document.getElementById("stage").classList.add("outro");}
  if(e.key==="s"||e.key==="S"){
    cp.innerHTML="<b>SFX CUE SHEET（秒）</b><br>"+CUES.slice().sort((a,b)=>a[0]-b[0])
      .map(c=>c[0].toFixed(2)+"s — "+c[1]).join("<br>");
    cp.style.display=cp.style.display==="block"?"none":"block";}});})();

$("#title").textContent=CONFIG.title;
$("#thead .tt").textContent=CONFIG.termTitle;
$("#status").textContent=CONFIG.status;
const box=$("#steps");
CONFIG.steps.forEach(st=>{
  const d=document.createElement("div");d.className="srow"+(st.focus?" focus":"");
  d.innerHTML=`<div class="cmdline"><span class="ps">&gt;</span><span class="ct"></span></div>
    <div class="done">${st.done}<span class="sparkslot">✳</span></div>`;
  d._cmd=st.cmd;box.appendChild(d);});

document.fonts.ready.then(()=>{fit();
  cue(0,"鋪底：溫柔環境音（極輕）");
  setTimeout(()=>{$("#title").classList.add("on");},400);
  cue(.9,"卡片浮上（軟 whoosh）");
  setTimeout(()=>{$("#term").classList.add("on");$("#status").classList.add("on");},900);
  const T=CONFIG.timing;let t=T.start+.6;
  [...box.children].forEach(row=>{
    const cmd=row._cmd,isF=row.classList.contains("focus");
    cue(t,"鍵盤輕敲 ×"+cmd.length+(isF?"（重點指令，稍重）":""));
    cue(t+cmd.length*T.typeChar+T.donePause,
        isF?"清脆 ✳ chime：重點完成":"軟 tick ✓：完成");
    setTimeout(()=>{row.classList.add("on");
      const ct=row.querySelector(".ct");let ci=0;
      (function type(){
        ct.innerHTML=cmd.slice(0,ci)+'<span class="cursor"></span>';
        ci++;
        if(ci<=cmd.length)setTimeout(type,T.typeChar*1000);
        else{setTimeout(()=>{ct.textContent=cmd;
          const dn=row.querySelector(".done");dn.classList.add("on");
          if(isF)setTimeout(()=>row.querySelector(".sparkslot").classList.add("on"),250);
        },T.donePause*1000);}})();
    },t*1000);
    t+=cmd.length*T.typeChar+T.donePause+T.stepPause;});});
</script>
</body>
</html>
