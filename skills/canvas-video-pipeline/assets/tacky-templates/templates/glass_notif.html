<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Liquid Glass 液態玻璃・通知卡 — Tacky Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:rgba(255,255,255,.96)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #fit{position:absolute}
  #stage{position:relative;overflow:hidden;background:#0e1424}
  .landscape #stage{width:1920px;height:1080px}
  .portrait  #stage{width:1080px;height:1920px}
  #camera{position:absolute;inset:0}

  #aurora{position:absolute;inset:-10%;transition:filter 1.4s ease}
  #aurora.key{filter:saturate(1.4) brightness(1.12)}
  .blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.85;will-change:transform}
  .b1{width:1100px;height:1100px;left:-220px;top:-260px;background:#2e6cf6;animation:drift1 26s ease-in-out infinite alternate}
  .b2{width:950px;height:950px;right:-180px;top:-140px;background:#8a3ff0;animation:drift2 31s ease-in-out infinite alternate}
  .b3{width:820px;height:820px;left:26%;bottom:-320px;background:#ff7ab8;animation:drift3 23s ease-in-out infinite alternate}
  .b4{width:700px;height:700px;right:14%;bottom:-200px;background:#ff9f3c;opacity:.7;animation:drift1 29s ease-in-out infinite alternate-reverse}
  @keyframes drift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(140px,90px) scale(1.12)}}
  @keyframes drift2{0%{transform:translate(0,0) scale(1.08)}100%{transform:translate(-120px,70px) scale(.96)}}
  @keyframes drift3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(110px,-80px) scale(1.15)}}

  .glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
    backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.10),
      inset 1px 0 0 rgba(255,255,255,.18),0 24px 60px rgba(4,8,20,.35);
    border-radius:36px}
  .glass .rim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    backdrop-filter:blur(46px) saturate(2.4) brightness(1.24);
    -webkit-backdrop-filter:blur(46px) saturate(2.4) brightness(1.24);
    padding:9px;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude}
  .glass .sheenWrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
  .glass .sheen{position:absolute;top:-20%;bottom:-20%;width:34%;left:0;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.34) 50%,transparent);
    transform:translateX(-260%) skewX(-14deg)}
  .glass.shine .sheen{animation:sweep 1.1s cubic-bezier(.4,.1,.2,1) forwards}
  @keyframes sweep{0%{transform:translateX(-260%) skewX(-14deg)}100%{transform:translateX(1050%) skewX(-14deg)}}

  #bar{position:absolute;display:flex;align-items:center;gap:20px;padding:18px 30px;border-radius:26px;opacity:0}
  .landscape #bar{top:84px;left:96px}.portrait #bar{top:96px;left:72px}
  #bar .lights{display:flex;gap:12px}
  #bar .lights i{width:18px;height:18px;border-radius:50%;display:block}
  #bar .lights i:nth-child(1){background:#ff5f57}#bar .lights i:nth-child(2){background:#febc2e}
  #bar .lights i:nth-child(3){background:#28c840}
  #bar .app{font-family:'Inter',sans-serif;font-weight:600;font-size:24px;color:var(--ink);letter-spacing:.04em}
  #bar.on{animation:notifIn .8s cubic-bezier(.2,1.1,.3,1) forwards}
  #clock{position:absolute;padding:16px 28px;border-radius:24px;opacity:0;
    font-family:'Inter',sans-serif;font-weight:600;font-size:24px;color:var(--ink);letter-spacing:.06em}
  .landscape #clock{top:84px;right:96px}.portrait #clock{top:96px;right:72px}
  #clock.on{animation:notifIn .8s cubic-bezier(.2,1.1,.3,1) .12s forwards}

  /* ---------- title ---------- */
  #title{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:'Noto Sans TC',sans-serif;font-weight:900;color:var(--ink);opacity:0;
    text-shadow:0 2px 12px rgba(4,8,20,.3);transition:opacity 1s ease}
  .landscape #title{top:186px;font-size:54px;letter-spacing:.12em;text-indent:.12em}
  .portrait  #title{top:400px;font-size:50px;letter-spacing:.1em;text-indent:.1em}
  #title.on{opacity:1}

  /* ---------- notification stack ---------- */
  #stack{position:absolute;display:flex;flex-direction:column}
  .landscape #stack{left:50%;transform:translateX(-50%);top:278px;width:1010px;gap:28px}
  .portrait  #stack{left:50%;transform:translateX(-50%);top:540px;width:870px;gap:40px}
  .notif{display:flex;align-items:center;gap:28px;padding:24px 40px;border-radius:30px;
    opacity:0;will-change:transform,opacity}
  .notif.on{animation:notifIn .85s cubic-bezier(.2,1.15,.3,1) forwards}
  @keyframes notifIn{0%{opacity:0;transform:translateY(-58px) scale(.95);border-radius:44px}
    60%{opacity:1;transform:translateY(6px) scale(1.014,.988);border-radius:26px}
    78%{transform:translateY(-2px) scale(.996,1.008);border-radius:36px}
    100%{opacity:1;transform:translateY(0) scale(1,1);border-radius:32px}}
  .notif.drift{animation:floatP var(--fd,7.9s) ease-in-out infinite alternate;opacity:1!important}
  #bar.drift,#clock.drift{animation:floatP var(--fd,9.7s) ease-in-out infinite alternate;opacity:1!important}
  @keyframes floatP{0%{transform:translateY(0)}100%{transform:translateY(-5px)}}
  .notif .icon{width:58px;height:58px;border-radius:18px;flex:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(4,8,20,.3)}
  .notif .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
  .notif .ti{font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:38px;
    color:var(--ink);white-space:nowrap;text-shadow:0 2px 10px rgba(4,8,20,.22)}
  .notif .sub{font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:25px;
    color:rgba(255,255,255,.68);white-space:nowrap;letter-spacing:.04em}
  .notif .when{margin-left:auto;font-family:'Inter','Noto Sans TC',sans-serif;font-weight:600;
    font-size:22px;color:rgba(255,255,255,.55);white-space:nowrap;flex:none}

  /* focus notification — the one that matters */
  .notif.focus.lit{background:linear-gradient(135deg,rgba(255,160,225,.32),rgba(160,190,255,.15));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.16),
      0 30px 80px rgba(4,8,20,.4),0 0 110px rgba(255,140,220,.2);
    animation:focusPop .65s cubic-bezier(.2,1.3,.3,1) forwards,
      floatF 6.1s ease-in-out .65s infinite alternate;
    opacity:1!important}
  @keyframes focusPop{0%{transform:translateY(0) scale(1)}
    55%{transform:translateY(-4px) scale(1.055,1.02)}
    100%{transform:translateY(-2px) scale(1.04)}}
  @keyframes floatF{0%{transform:translateY(-2px) scale(1.04)}
    100%{transform:translateY(-8px) scale(1.04)}}
  .notif.focus.lit .when{color:rgba(255,255,255,.85)}

  /* ---------- note ---------- */
  #note{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:28px;
    color:rgba(255,255,255,.8);letter-spacing:.14em;opacity:0;transition:opacity 1.2s ease;
    text-shadow:0 2px 12px rgba(4,8,20,.3)}
  .landscape #note{bottom:60px}.portrait #note{bottom:320px}
  #note.on{opacity:1}

  #cd{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#0e1424}
  #cd span{font-family:'Inter',sans-serif;font-weight:700;font-size:300px;color:#fff}
  #cues{position:absolute;right:24px;top:24px;z-index:21;display:none;background:rgba(10,14,26,.94);
    color:#fff;font-family:monospace;font-size:15px;line-height:1.75;
    padding:14px 18px;max-height:70%;overflow:auto;border-radius:14px}
  .outro .notif,.outro #bar,.outro #clock,.outro #title{
    transition:opacity .9s ease,transform .9s cubic-bezier(.5,0,.7,.4),filter .9s ease;
    animation:none!important;
    opacity:0!important;transform:translateY(-34px) scale(1.02);filter:blur(16px)}
  .outro #note{transition:opacity .6s;opacity:0!important}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="camera">
    <div id="aurora"><div class="blob b1"></div><div class="blob b2"></div>
      <div class="blob b3"></div><div class="blob b4"></div></div>
    <div id="bar" class="glass"><div class="lights"><i></i><i></i><i></i></div>
      <span class="app"></span></div>
    <div id="clock" class="glass"></div>
    <div id="title"></div>
    <div id="stack"></div>
    <div id="note"></div>
  </div>
</div></div>

<script>
/* ============================================================
   CONFIG — Liquid Glass・通知卡 (notification stack)
   For lists, steps, checklists, reminders — served as macOS
   notification banners that jelly-drop from the top in order.
   items: {t:"title", sub:"secondary line", when:"現在",
           icon:"#5ac8fa,#2e6cf6" (gradient stops),
           focus:true → pops last: pink glass, scales up 4%,
           wallpaper saturates}
   ONE focus item. 3–4 items ideal.
   ============================================================ */
const CONFIG = {
  orientation: "landscape",
  app: "b-roll.app",
  clock: "auto",
  title: "拍片前的四則通知",
  items: [
    { t:"構圖：留白多一點",   sub:"主體不用永遠置中",       when:"5 分鐘前", icon:"#5ac8fa,#2e6cf6" },
    { t:"光線：關大燈，開檯燈", sub:"一顆光源就有戲",         when:"3 分鐘前", icon:"#ffd60a,#ff9f0a" },
    { t:"收音：麥克風靠近一點", sub:"觀眾用耳朵決定畫質",     when:"1 分鐘前", icon:"#bf5af2,#8a3ff0" },
    { t:"按下錄影",            sub:"其他都能後製，開始不能", when:"現在",     icon:"#ff7ab8,#ff375f", focus:true }
  ],
  note: "通知來自：未來的你",
  timing: { start: 1.2, stagger: 0.5 }
};
/* ============================================================ */
const $=q=>document.querySelector(q);
const stagePx=()=>CONFIG.orientation==="portrait"?[1080,1920]:[1920,1080];
document.body.parentElement.className=CONFIG.orientation;
function fit(){const[W,H]=stagePx();const s=Math.min(innerWidth/W,innerHeight/H);
  $("#fit").style.cssText=`position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;`+
  `transform:translate(-50%,-50%) scale(${s});`;}
addEventListener("resize",fit);fit();

const CUES=[];const cue=(t,l)=>CUES.push([t,l]);
(function(){const st=document.getElementById("stage");
 const cd=document.createElement("div");cd.id="cd";cd.innerHTML="<span></span>";st.appendChild(cd);
 const cp=document.createElement("div");cp.id="cues";st.appendChild(cp);
 addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){let n=3;cd.style.display="flex";
    const s=cd.querySelector("span");s.textContent=n;
    const iv=setInterval(()=>{n--;if(n<1){clearInterval(iv);location.reload();}else s.textContent=n;},700);}
  if(e.key==="o"||e.key==="O"){document.getElementById("stage").classList.add("outro");}
  if(e.key==="s"||e.key==="S"){
    cp.innerHTML="<b>SFX CUE SHEET（秒）</b><br>"+CUES.slice().sort((a,b)=>a[0]-b[0])
      .map(c=>c[0].toFixed(2)+"s — "+c[1]).join("<br>");
    cp.style.display=cp.style.display==="block"?"none":"block";}});})();

function dressGlass(el){
  const r=document.createElement("div");r.className="rim";el.appendChild(r);
  const sw=document.createElement("div");sw.className="sheenWrap";
  sw.innerHTML="<div class=\"sheen\"></div>";el.appendChild(sw);}

/* build */
const stack=$("#stack");const notifs=[];
CONFIG.items.forEach(it=>{
  const n=document.createElement("div");n.className="notif glass"+(it.focus?" focus":"");
  const ic=document.createElement("div");ic.className="icon";
  const g=(it.icon||"#5ac8fa,#2e6cf6").split(",");
  ic.style.background="linear-gradient(135deg,"+g[0]+","+g[1]+")";
  const tx=document.createElement("div");tx.className="txt";
  const ti=document.createElement("div");ti.className="ti";ti.textContent=it.t;
  tx.appendChild(ti);
  if(it.sub){const su=document.createElement("div");su.className="sub";
    su.textContent=it.sub;tx.appendChild(su);}
  const wh=document.createElement("div");wh.className="when";wh.textContent=it.when||"現在";
  n.appendChild(ic);n.appendChild(tx);n.appendChild(wh);
  dressGlass(n);
  n._flags=it;stack.appendChild(n);notifs.push(n);});
$("#bar .app").textContent=CONFIG.app;
$("#title").textContent=CONFIG.title;
$("#note").textContent=CONFIG.note;
dressGlass($("#bar"));dressGlass($("#clock"));
(function(){const el=$("#clock");
  if(CONFIG.clock!=="auto"){el.textContent=CONFIG.clock;return;}
  const tick=()=>{const d=new Date();
    el.textContent=String(d.getHours()).padStart(2,"0")+":"+
      String(d.getMinutes()).padStart(2,"0");};
  tick();setInterval(tick,15000);})();

document.fonts.ready.then(()=>{fit();
  const T=CONFIG.timing;let t=T.start;
  cue(t-.6,"水滴 drop / 玻璃輕響：工具列浮入");
  setTimeout(()=>{
    const b=$("#bar"),c=$("#clock");
    b.classList.add("on");c.classList.add("on");$("#title").classList.add("on");
    setTimeout(()=>{b.classList.add("drift");b.style.setProperty("--fd","9.7s");
      c.classList.add("drift");c.style.setProperty("--fd","11.3s");},1100);
  },(t-.6)*1000);
  let focusEl=null;
  notifs.forEach((n,i)=>{
    cue(t,"通知咚 notification thunk：橫幅果凍落下");
    setTimeout(()=>{n.classList.add("on");
      setTimeout(()=>n.classList.add("shine"),560);
      if(!n._flags.focus)
        setTimeout(()=>{n.classList.add("drift");
          n.style.setProperty("--fd",(7.9+i*1.4)+"s");},1000);
    },t*1000);
    if(n._flags.focus)focusEl=n;
    t+=T.stagger;});
  if(focusEl){const tK=t+.5;
    cue(tK,"低音水滴 bloom：關鍵通知轉粉紅放大＋壁紙飽和");
    setTimeout(()=>{focusEl.classList.add("lit");
      $("#aurora").classList.add("key");
      setTimeout(()=>focusEl.classList.add("shine"),650);},tK*1000);
    t=tK+1;}
  cue(t+.4,"氣音：註解浮現");
  setTimeout(()=>$("#note").classList.add("on"),(t+.4)*1000);});
</script>
</body>
</html>
