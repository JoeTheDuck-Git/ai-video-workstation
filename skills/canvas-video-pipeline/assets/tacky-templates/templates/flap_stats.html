<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Split-flap 翻牌看板・數字卡 — Tacky Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#0f1114;--tile1:#22262e;--tile2:#191c22;--char:#f2f0e6;
    --amber:#ffb02e;--amberInk:#191204;--red:#e0483e;--dim:#6a707c}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #fit{position:absolute}
  #stage{position:relative;overflow:hidden;background:var(--board)}
  .landscape #stage{width:1920px;height:1080px}
  .portrait  #stage{width:1080px;height:1920px}
  #camera{position:absolute;inset:0}
  #wall{position:absolute;inset:0;
    background:linear-gradient(180deg,#13151a 0%,#0f1114 40%,#0b0d10 100%)}
  #wall::after{content:"";position:absolute;inset:0;opacity:.35;
    background:repeating-linear-gradient(90deg,transparent 0 90px,rgba(255,255,255,.012) 90px 92px)}

  #head{position:absolute;display:flex;align-items:baseline;justify-content:space-between;
    opacity:0;transition:opacity .9s ease}
  .landscape #head{left:130px;right:130px;top:96px}
  .portrait  #head{left:76px;right:76px;top:120px}
  #head.on{opacity:1}
  #head .dep{font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:40px;
    color:var(--amber);letter-spacing:.3em;white-space:nowrap}
  #head .dep .en{font-family:'Inter',sans-serif;font-weight:700;font-size:24px;
    color:var(--dim);letter-spacing:.4em;margin-left:26px}
  #head .clk{font-family:'Inter',sans-serif;font-weight:700;font-size:40px;
    color:var(--amber);letter-spacing:.12em;font-variant-numeric:tabular-nums}
  #rule{position:absolute;height:3px;background:linear-gradient(90deg,var(--amber),rgba(255,176,46,.15));
    transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.2,.8,.2,1) .2s}
  .landscape #rule{left:130px;right:130px;top:170px}
  .portrait  #rule{left:76px;right:76px;top:196px}
  #rule.on{transform:scaleX(1)}

  /* ---------- stat rows ---------- */
  #list{position:absolute;left:50%;transform:translateX(-50%);display:flex;
    flex-direction:column}
  .landscape #list{top:266px;gap:56px}
  .portrait  #list{top:340px;gap:64px}
  .srow{display:flex;align-items:center;gap:56px;position:relative}
  .srow .lab{font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:40px;
    color:var(--dim);letter-spacing:.24em;white-space:nowrap;
    width:280px;text-align:right;transition:color .6s ease}
  .portrait .srow .lab{width:220px;font-size:34px}
  .srow.locked.hl .lab{color:var(--amber)}
  .col{display:flex;gap:10px}
  .tile{width:var(--ts);height:calc(var(--ts)*1.26);position:relative;border-radius:9px;
    background:linear-gradient(180deg,var(--tile1) 0%,var(--tile1) 49%,var(--tile2) 51%,var(--tile2) 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.4),
      0 8px 20px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:2.5px;
    margin-top:-1.25px;background:rgba(0,0,0,.55);z-index:3}
  .tile .c{font-family:'Noto Sans TC';font-weight:900;color:var(--char);
    font-size:calc(var(--ts)*.68);line-height:1;transform:translateY(2%);z-index:2}
  .tile.flip .c{animation:clack .1s cubic-bezier(.3,0,.7,1)}
  @keyframes clack{0%{transform:translateY(2%) scaleY(.55)}100%{transform:translateY(2%) scaleY(1)}}
  .tile.amber{background:linear-gradient(180deg,#ffc85e 0%,var(--amber) 49%,#e89a18 51%,#d68d12 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.25),
      0 8px 26px rgba(255,176,46,.25)}
  .tile.amber .c{color:var(--amberInk)}
  .srow .fframe{position:absolute;top:-14px;bottom:-14px;border:3px solid var(--amber);
    border-radius:14px;opacity:0;transform:scale(1.04);pointer-events:none;
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,1.2,.3,1)}
  .srow.locked .fframe{opacity:1;transform:scale(1)}

  /* ---------- source ---------- */
  #source{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:24px;
    color:#3c424c;letter-spacing:.18em;opacity:0;transition:opacity 1s ease}
  .landscape #source{bottom:88px}.portrait #source{bottom:330px}
  #source.on{opacity:1}
  .meta{position:absolute;font-family:'Inter','Noto Sans TC',sans-serif;font-weight:700;
    font-size:18px;letter-spacing:.26em;color:#3c424c;opacity:0;transition:opacity 1.2s}
  .meta.on{opacity:1}
  .landscape #metaBL{bottom:88px;left:130px}.landscape #metaBR{bottom:88px;right:130px}
  .portrait #metaBL{bottom:120px;left:76px}.portrait #metaBR{bottom:120px;right:76px}

  #cd{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--board)}
  #cd span{font-family:'Inter',sans-serif;font-weight:700;font-size:300px;color:var(--char)}
  #cues{position:absolute;right:24px;top:24px;z-index:21;display:none;background:rgba(10,12,16,.95);
    color:#f2f0e6;font-family:monospace;font-size:15px;line-height:1.75;
    padding:14px 18px;max-height:70%;overflow:auto;border:1px solid #262b34}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="camera">
    <div id="wall"></div>
    <div id="head"><div class="dep"></div><div class="clk"></div></div>
    <div id="rule"></div>
    <div id="list"></div>
    <div id="source"></div>
    <div class="meta" id="metaBL"></div><div class="meta" id="metaBR"></div>
  </div>
</div></div>

<script>
/* ============================================================
   CONFIG — Split-flap・數字卡 (flap-digit stats)
   For numbers/stats — each value spelled out in flap tiles that
   clatter to their digits. Label painted left, value in tiles.
   stats: {val:"+38%", lab:"觀看時長",
           hl:true → flips LAST, all tiles amber + frame + label
           turns amber}
   ONE hl stat. 2–3 stats. Source line is MANDATORY — never
   invent data; ask for real numbers or mark 示意.
   ============================================================ */
const CONFIG = {
  orientation: "landscape",
  header: "本月戰績",
  headerEn: "MONTHLY BOARD",
  clock: "auto",
  stats: [
    { val:"+38%",  lab:"觀看時長" },
    { val:"52%",   lab:"完播率" },
    { val:"3.2萬", lab:"新訂閱", hl:true }
  ],
  source: "資料來源：頻道後台 2026.06（示意數據）",
  metaBL: "PLATFORM 10",
  metaBR: "TAIPEI CENTRAL",
  timing: { start: 1.2, rowGap: 0.7, tileStagger: 0.11 }
};
/* ============================================================ */
const $=q=>document.querySelector(q);
const stagePx=()=>CONFIG.orientation==="portrait"?[1080,1920]:[1920,1080];
document.body.parentElement.className=CONFIG.orientation;
function fit(){const[W,H]=stagePx();const s=Math.min(innerWidth/W,innerHeight/H);
  $("#fit").style.cssText=`position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;`+
  `transform:translate(-50%,-50%) scale(${s});`;}
addEventListener("resize",fit);fit();

const CUES=[];const cue=(t,l)=>CUES.push([t,l]);
(function(){const st=document.getElementById("stage");
 const cd=document.createElement("div");cd.id="cd";cd.innerHTML="<span></span>";st.appendChild(cd);
 const cp=document.createElement("div");cp.id="cues";st.appendChild(cp);
 addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){let n=3;cd.style.display="flex";
    const s=cd.querySelector("span");s.textContent=n;
    const iv=setInterval(()=>{n--;if(n<1){clearInterval(iv);location.reload();}else s.textContent=n;},700);}
  if(e.key==="o"||e.key==="O"){boardClear();}
  if(e.key==="s"||e.key==="S"){
    cp.innerHTML="<b>SFX CUE SHEET（秒）</b><br>"+CUES.slice().sort((a,b)=>a[0]-b[0])
      .map(c=>c[0].toFixed(2)+"s — "+c[1]).join("<br>");
    cp.style.display=cp.style.display==="block"?"none":"block";}});})();

const POOL=("0123456789%+.萬千億人次分鐘小時天").split("");
CONFIG.stats.forEach(s=>[...s.val].forEach(c=>{if(!POOL.includes(c))POOL.push(c);}));
const rnd=a=>a[Math.floor(Math.random()*a.length)];

const maxV=Math.max(...CONFIG.stats.map(s=>[...s.val].length));
const isP=CONFIG.orientation==="portrait";
const TS=Math.min(isP?120:140,Math.floor((isP?600:900)/maxV));
document.documentElement.style.setProperty("--ts",TS+"px");

/* build */
const list=$("#list");const rows=[];
CONFIG.stats.forEach(st=>{
  const row=document.createElement("div");row.className="srow"+(st.hl?" hl":"");
  const lab=document.createElement("div");lab.className="lab";lab.textContent=st.lab;
  const col=document.createElement("div");col.className="col";
  [...st.val].forEach(ch=>{
    const tl=document.createElement("div");tl.className="tile";
    const c=document.createElement("span");c.className="c";c.textContent="";
    tl.appendChild(c);tl._c=c;tl._target=ch;col.appendChild(tl);});
  row.appendChild(lab);row.appendChild(col);
  if(st.hl){const f=document.createElement("div");f.className="fframe";
    f.style.left=(isP?220+56:280+56)+"px";f.style.right="-20px";row.appendChild(f);}
  row._flags=st;list.appendChild(row);rows.push(row);});
$("#head .dep").innerHTML=CONFIG.header+"<span class=\"en\">"+CONFIG.headerEn+"</span>";
$("#source").textContent=CONFIG.source;
$("#metaBL").textContent=CONFIG.metaBL;$("#metaBR").textContent=CONFIG.metaBR;
(function(){const el=$("#head .clk");
  if(CONFIG.clock!=="auto"){el.textContent=CONFIG.clock;return;}
  const tick=()=>{const d=new Date();
    el.textContent=String(d.getHours()).padStart(2,"0")+":"+
      String(d.getMinutes()).padStart(2,"0");};
  tick();setInterval(tick,15000);})();

function flipTo(tile,target,steps,cls){
  let n=0,delay=52;
  (function step(){
    tile.classList.remove("flip");void tile.offsetWidth;tile.classList.add("flip");
    if(n>=steps){tile._c.textContent=target;
      if(cls)tile.classList.add(cls);return;}
    tile._c.textContent=rnd(POOL);n++;delay*=1.14;
    setTimeout(step,delay);})();}

function boardClear(){
  const tiles=[...document.querySelectorAll(".tile")];
  tiles.forEach((tl,i)=>setTimeout(()=>{
    tl.classList.remove("amber");
    flipTo(tl,"",3+Math.floor(Math.random()*3));},i*50));
  document.querySelectorAll(".srow").forEach(r=>r.classList.remove("locked"));
  setTimeout(()=>{$("#source").style.opacity=0;
    document.querySelectorAll(".meta").forEach(m=>m.style.opacity=0);},tiles.length*50+400);}

document.fonts.ready.then(()=>{fit();
  const T=CONFIG.timing;let t=T.start;
  cue(.3,"機械環境音 vestibule hum（墊底）");
  cue(.4,"叮咚 station chime：看板亮起");
  setTimeout(()=>{$("#head").classList.add("on");$("#rule").classList.add("on");},400);
  document.querySelectorAll(".meta").forEach(m=>setTimeout(()=>m.classList.add("on"),700));
  let hlRow=null;
  rows.forEach(row=>{
    if(row._flags.hl){hlRow=row;return;}          // the record flips last
    cue(t,"嗒嗒嗒 flap clatter：數字翻牌");
    const tiles=[...row.querySelectorAll(".tile")];
    tiles.forEach((tl,i)=>setTimeout(()=>
      flipTo(tl,tl._target,6+Math.floor(Math.random()*4)),
      (t+i*T.tileStagger)*1000));
    t+=tiles.length*T.tileStagger+T.rowGap;});
  if(hlRow){const tK=t+.5;
    cue(tK,"嗒嗒…咔咔咔！amber lock：主數字整排鎖定琥珀");
    const tiles=[...hlRow.querySelectorAll(".tile")];
    tiles.forEach((tl,i)=>setTimeout(()=>{
      flipTo(tl,tl._target,5,"amber");},(tK+i*.14)*1000));
    const tF=tK+tiles.length*.14+.4;
    cue(tF,"低音 thunk：琥珀框合上");
    setTimeout(()=>hlRow.classList.add("locked"),tF*1000);
    t=tF+.4;}
  cue(t+.3,"叮：資料來源浮現");
  setTimeout(()=>$("#source").classList.add("on"),(t+.3)*1000);
  /* ambient re-adjust */
  setTimeout(()=>{const amb=[...document.querySelectorAll(".tile:not(.amber)")]
      .filter(tl=>tl._c.textContent);
    setInterval(()=>{const tl=rnd(amb);
      if(tl)flipTo(tl,tl._target,2);},4200);},(t+1)*1000);});
</script>
</body>
</html>
