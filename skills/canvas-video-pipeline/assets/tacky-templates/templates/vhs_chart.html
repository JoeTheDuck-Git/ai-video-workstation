<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>VHS 錄影帶・訊號表 — Tacky Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--crt:#0a0d10;--crt2:#11161b;--phos:#e8f4ee;--osd:#e6ecf2;--dim:#6d7a84;
        --glow:rgba(150,230,190,.35);--seg:#3fd9a4;--segdim:#17332a;
        --amber:#ffc14d;--warn:#ff5c5c}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #fit{position:absolute}
  #stage{position:relative;overflow:hidden;background:var(--crt);border-radius:26px}
  .landscape #stage{width:1920px;height:1080px}
  .portrait  #stage{width:1080px;height:1920px}
  #camera{position:absolute;inset:0;will-change:transform}
  #tube{position:absolute;inset:0;background:
    radial-gradient(120% 105% at 50% 45%, var(--crt2) 0%, var(--crt) 68%, #05070a 100%)}
  #scanlines{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.5;background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.32) 0 2px, transparent 2px 4.5px)}
  #aperture{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.16;background:
    repeating-linear-gradient(90deg, rgba(255,60,60,.5) 0 1.4px, rgba(60,255,120,.5) 1.4px 2.8px,
    rgba(80,120,255,.5) 2.8px 4.2px)}
  #crtVignette{position:absolute;inset:0;z-index:8;pointer-events:none;background:
    radial-gradient(108% 96% at 50% 48%, transparent 55%, rgba(0,0,0,.55) 92%, rgba(0,0,0,.8) 100%)}
  #poweron{position:absolute;inset:0;z-index:12;background:#000;display:flex;
    align-items:center;justify-content:center}
  #poweron .beam{width:0;height:4px;background:#fff;border-radius:2px;
    box-shadow:0 0 40px 8px rgba(255,255,255,.8)}
  #poweron.go .beam{animation:beamX .34s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes beamX{to{width:100%}}
  #poweron.go{animation:beamY .5s .3s cubic-bezier(.3,.7,.2,1) forwards}
  @keyframes beamY{0%{transform:scaleY(.004)}70%{transform:scaleY(1);opacity:1}
    100%{transform:scaleY(1);opacity:0;visibility:hidden}}

  #hdr{position:absolute;left:50%;transform:translateX(-50%);z-index:5;opacity:0;
    font-family:'VT323','Noto Sans TC',monospace;color:var(--osd);letter-spacing:.16em;
    text-shadow:0 0 10px rgba(200,230,255,.4);white-space:nowrap;transition:opacity .6s}
  .landscape #hdr{top:96px;font-size:58px}
  .portrait  #hdr{top:210px;font-size:48px}
  #hdr.on{opacity:.95}

  /* ---------- LED signal meters ---------- */
  #meters{position:absolute;z-index:4;display:flex;flex-direction:column;
    justify-content:space-evenly}
  .landscape #meters{left:280px;right:280px;top:230px;bottom:200px}
  .portrait  #meters{left:90px;right:90px;top:400px;bottom:400px}
  .mrow{display:flex;align-items:center;gap:36px;opacity:0;transition:opacity .4s}
  .mrow.on{opacity:1}
  .mrow .lbl{font-family:'Noto Sans TC';font-weight:700;color:var(--phos);text-align:right;
    flex:0 0 auto;white-space:nowrap;
    text-shadow:0 0 10px var(--glow),1.5px 0 0 rgba(255,70,70,.3),-1.5px 0 0 rgba(60,190,255,.3)}
  .landscape .mrow .lbl{width:230px;font-size:40px}
  .portrait  .mrow .lbl{width:180px;font-size:34px}
  .mrow .track{flex:1;display:flex;gap:7px;align-items:center}
  .seg{flex:1;border-radius:2px;background:var(--segdim);
    box-shadow:inset 0 0 4px rgba(0,0,0,.6)}
  .landscape .seg{height:44px}.portrait .seg{height:38px}
  .seg.lit{background:var(--seg);box-shadow:0 0 12px rgba(63,217,164,.5)}
  .seg.lit.zamber{background:var(--amber);box-shadow:0 0 12px rgba(255,193,77,.5)}
  .seg.lit.zred{background:var(--warn);box-shadow:0 0 14px rgba(255,92,92,.6)}
  .mrow.hl .seg.lit.zred{animation:overload .5s steps(2) 3 .1s}
  @keyframes overload{50%{opacity:.45}}
  .mrow .val{font-family:'VT323',monospace;color:var(--dim);flex:0 0 auto;text-align:right;
    letter-spacing:.04em;text-shadow:0 0 8px rgba(150,200,255,.25)}
  .landscape .mrow .val{width:170px;font-size:52px}
  .portrait  .mrow .val{width:140px;font-size:44px}
  .mrow.hl .val{color:var(--warn);text-shadow:0 0 14px rgba(255,92,92,.5)}
  .mrow.hl .lbl{color:#fff}

  #note{position:absolute;z-index:5;font-family:'VT323','Noto Sans TC',monospace;
    color:var(--warn);letter-spacing:.1em;opacity:0;white-space:nowrap;
    text-shadow:0 0 12px rgba(255,92,92,.5)}
  .landscape #note{right:280px;bottom:130px;font-size:44px}
  .portrait  #note{right:90px;bottom:330px;font-size:38px}
  #note.on{opacity:.95;animation:blink 1.2s steps(1) 2}
  #source{position:absolute;z-index:5;font-family:'VT323','Noto Sans TC',monospace;
    color:var(--dim);letter-spacing:.08em;opacity:0;transition:opacity .8s}
  .landscape #source{left:280px;bottom:74px;font-size:30px}
  .portrait  #source{left:90px;bottom:120px;font-size:27px}
  #source.on{opacity:.85}

  .osd{position:absolute;z-index:9;font-family:'VT323',monospace;color:var(--osd);
    text-shadow:0 0 8px rgba(200,230,255,.5);letter-spacing:.06em;opacity:0;transition:opacity .5s}
  .osd.on{opacity:.92}
  .landscape #osdTL{top:64px;left:86px;font-size:44px}
  .landscape #osdTR{top:64px;right:86px;font-size:44px;text-align:right}
  .portrait #osdTL{top:74px;left:60px;font-size:38px}
  .portrait #osdTR{top:74px;right:60px;font-size:38px;text-align:right}
  #osdTL .rec{display:inline-block;width:20px;height:20px;border-radius:50%;
    background:var(--warn);margin-right:14px;box-shadow:0 0 12px var(--warn);
    animation:blink 1.1s steps(1) infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}
  #camera.hsync{animation:hsync .18s steps(3,end)}
  @keyframes hsync{30%{transform:translateX(-14px) skewX(-1.5deg)}
    60%{transform:translateX(9px) skewX(1deg)}}
  #cd{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--crt)}
  #cd span{font-family:'VT323',monospace;font-size:360px;color:var(--phos);
    text-shadow:0 0 30px var(--glow)}
  #cues{position:absolute;right:24px;top:24px;z-index:21;display:none;background:rgba(5,8,10,.95);
    color:var(--osd);font-family:'VT323',monospace;font-size:19px;line-height:1.6;
    padding:14px 18px;max-height:70%;overflow:auto;border:1px solid #2a3138}
  .outro #camera{animation:crtOff .45s cubic-bezier(.6,0,.9,.4) forwards}
  @keyframes crtOff{60%{transform:scaleY(.006);filter:brightness(2.4)}
    100%{transform:scaleY(.002) scaleX(0);filter:brightness(4);opacity:0}}
  .outro #scanlines,.outro #aperture{opacity:0}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="camera">
    <div id="tube"></div>
    <div id="hdr"></div>
    <div id="meters"></div>
    <div id="note"></div>
    <div id="source"></div>
    <div class="osd" id="osdTL"><span class="rec"></span><span>SIGNAL</span></div>
    <div class="osd" id="osdTR">LEVEL CHECK</div>
  </div>
  <canvas id="snow"></canvas>
  <div id="aperture"></div><div id="scanlines"></div><div id="crtVignette"></div>
  <div id="poweron"><div class="beam"></div></div>
</div></div>

<script>
/* ============================================================
   CONFIG — VHS 錄影帶・訊號表 (segmented LED meters).
   Data as an old deck's level meters: segments light one by one;
   the hl row PEAKS INTO THE RED with overload flicker + a red
   note. Green→amber→red zones are automatic (last 25% amber,
   last 12% red of the FULL scale). Real numbers + source,
   Studio-wide ethics.
   ============================================================ */
const CONFIG = {
  orientation: "landscape",
  title: "觀眾在第幾秒滑走",
  unit: "%", segs: 24,
  data: [
    {label:"前 3 秒",  value:63, hl:true},
    {label:"3–10 秒",  value:21},
    {label:"10–30 秒", value:11},
    {label:"30 秒後",  value:5}
  ],
  note: "⚠ 訊號超載",
  source: "SOURCE: TikTok Creator Center 2025",
  timing: { start: 1.6, stagger: 0.5, segTick: 0.03 }
};
/* ============================================================ */
const $=q=>document.querySelector(q);
const stagePx=()=>CONFIG.orientation==="portrait"?[1080,1920]:[1920,1080];
document.body.parentElement.className=CONFIG.orientation;
function fit(){const[W,H]=stagePx();const s=Math.min(innerWidth/W,innerHeight/H);
  $("#fit").style.cssText=`position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;`+
  `transform:translate(-50%,-50%) scale(${s});`;}
addEventListener("resize",fit);fit();
const CUES=[];const cue=(t,l)=>CUES.push([t,l]);
(function(){const st=document.getElementById("stage");
 const cd=document.createElement("div");cd.id="cd";cd.innerHTML="<span></span>";st.appendChild(cd);
 const cp=document.createElement("div");cp.id="cues";st.appendChild(cp);
 addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){let n=3;cd.style.display="flex";
    const s=cd.querySelector("span");s.textContent=n;
    const iv=setInterval(()=>{n--;if(n<1){clearInterval(iv);location.reload();}else s.textContent=n;},700);}
  if(e.key==="o"||e.key==="O"){document.getElementById("stage").classList.add("outro");}
  if(e.key==="s"||e.key==="S"){
    cp.innerHTML="<b>SFX CUE SHEET（秒）</b><br>"+CUES.slice().sort((a,b)=>a[0]-b[0])
      .map(c=>c[0].toFixed(2)+"s — "+c[1]).join("<br>");
    cp.style.display=cp.style.display==="block"?"none":"block";}});})();

$("#hdr").textContent=CONFIG.title;
$("#note").textContent=CONFIG.note;
$("#source").textContent=CONFIG.source;
(function(){const c=$("#snow"),[W,H]=stagePx();c.width=W/3;c.height=H/3;
  const ctx=c.getContext("2d");c.style.cssText="position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;opacity:.10;mix-blend-mode:screen";
  (function loop(){const img=ctx.createImageData(c.width,c.height),d=img.data;
    for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=54;}
    ctx.putImageData(img,0,0);setTimeout(loop,50);})();})();
setInterval(()=>{const c=$("#camera");c.classList.remove("hsync");void c.offsetWidth;
  c.classList.add("hsync");},5600);

document.fonts.ready.then(()=>{fit();
  cue(0,"CRT 開機 whine + pop");cue(.7,"鋪底：機械運轉 hum（整段）");
  $("#poweron").classList.add("go");
  setTimeout(()=>{$("#hdr").classList.add("on");
    document.querySelectorAll(".osd").forEach((o,i)=>setTimeout(()=>o.classList.add("on"),i*90));},800);
  const box=$("#meters"),n=CONFIG.segs,maxV=Math.max(...CONFIG.data.map(d=>d.value));
  CONFIG.data.forEach(d=>{
    const row=document.createElement("div");row.className="mrow"+(d.hl?" hl":"");
    let segs="";for(let i=0;i<n;i++)segs+=`<div class="seg"></div>`;
    row.innerHTML=`<span class="lbl">${d.label}</span>
      <div class="track">${segs}</div><span class="val">0${CONFIG.unit}</span>`;
    box.appendChild(row);});
  const T=CONFIG.timing;
  [...box.children].forEach((row,i)=>{const d=CONFIG.data[i];
    const lit=Math.round(d.value/maxV*n);
    cue(T.start+i*T.stagger,"LED tick 連發 ×"+lit+"："+d.label);
    if(d.hl)cue(T.start+i*T.stagger+lit*T.segTick+.15,"過載嗶警 + 紅燈閃：亮點爆表");
    setTimeout(()=>{row.classList.add("on");
      const segEls=row.querySelectorAll(".seg"),val=row.querySelector(".val");
      segEls.forEach((s,si)=>{ if(si>=lit)return;
        setTimeout(()=>{s.classList.add("lit");
          if(si>=n*.88)s.classList.add("zred");
          else if(si>=n*.75)s.classList.add("zamber");
          val.textContent=Math.round((si+1)/n*maxV)+CONFIG.unit;
        },si*T.segTick*1000);});
      setTimeout(()=>{val.textContent=d.value+CONFIG.unit;
        if(d.hl){$("#note").classList.add("on");}},lit*T.segTick*1000+120);
    },(T.start+i*T.stagger)*1000);});
  setTimeout(()=>$("#source").classList.add("on"),
    (T.start+CONFIG.data.length*T.stagger+1.3)*1000);});
</script>
</body>
</html>
