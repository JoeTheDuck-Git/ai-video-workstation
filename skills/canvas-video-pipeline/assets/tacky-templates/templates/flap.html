<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Split-flap 翻牌看板 — Tacky Templates (exploration)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#0f1114;
    --tile1:#22262e; --tile2:#191c22;      /* tile face gradient */
    --char:#f2f0e6;                         /* warm off-white flaps */
    --amber:#ffb02e; --amberInk:#191204;    /* key: inverse amber tile */
    --red:#e0483e;                          /* cancelled */
    --dim:#6a707c}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #fit{position:absolute}
  #stage{position:relative;overflow:hidden;background:var(--board)}
  .landscape #stage{width:1920px;height:1080px}
  .portrait  #stage{width:1080px;height:1920px}
  #camera{position:absolute;inset:0}
  /* board texture: subtle vertical brushed strips */
  #wall{position:absolute;inset:0;
    background:linear-gradient(180deg,#13151a 0%,#0f1114 40%,#0b0d10 100%)}
  #wall::after{content:"";position:absolute;inset:0;opacity:.35;
    background:repeating-linear-gradient(90deg,transparent 0 90px,rgba(255,255,255,.012) 90px 92px)}

  /* ---------- header strip ---------- */
  #head{position:absolute;display:flex;align-items:baseline;justify-content:space-between;
    opacity:0;transition:opacity .9s ease}
  .landscape #head{left:130px;right:130px;top:104px}
  .portrait  #head{left:76px;right:76px;top:120px}
  #head.on{opacity:1}
  #head .dep{font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:40px;
    color:var(--amber);letter-spacing:.3em;white-space:nowrap}
  #head .dep .en{font-family:'Inter',sans-serif;font-weight:700;font-size:24px;
    color:var(--dim);letter-spacing:.4em;margin-left:26px}
  #head .clk{font-family:'Inter',sans-serif;font-weight:700;font-size:40px;
    color:var(--amber);letter-spacing:.12em;font-variant-numeric:tabular-nums}
  #rule{position:absolute;height:3px;background:linear-gradient(90deg,var(--amber),rgba(255,176,46,.15));
    transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.2,.8,.2,1) .2s}
  .landscape #rule{left:130px;right:130px;top:178px}
  .portrait  #rule{left:76px;right:76px;top:196px}
  #rule.on{transform:scaleX(1)}

  /* ---------- the board ---------- */
  #board{position:absolute;left:0;right:0;display:flex;flex-direction:column;
    align-items:center}
  .landscape #board{top:50%;transform:translateY(-50%);gap:54px}
  .portrait  #board{top:50%;transform:translateY(-52%);gap:60px}
  .row{display:flex;align-items:center;gap:14px}
  .wgroup{display:flex;gap:14px;position:relative}
  .wgap{width:calc(var(--ts)*.34)}
  .tile{width:var(--ts);height:calc(var(--ts)*1.26);position:relative;border-radius:10px;
    background:linear-gradient(180deg,var(--tile1) 0%,var(--tile1) 49%,var(--tile2) 51%,var(--tile2) 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.4),
      0 10px 24px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  /* the split line */
  .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;
    margin-top:-1.5px;background:rgba(0,0,0,.55);z-index:3}
  /* side pins */
  .tile::before{content:"";position:absolute;top:50%;width:100%;height:12px;margin-top:-6px;
    background:linear-gradient(90deg,rgba(0,0,0,.6) 0 7px,transparent 7px calc(100% - 7px),rgba(0,0,0,.6) calc(100% - 7px));
    z-index:4;pointer-events:none}
  .tile .c{font-family:'Noto Sans TC';font-weight:900;color:var(--char);
    font-size:calc(var(--ts)*.72);line-height:1;transform:translateY(2%);z-index:2;
    will-change:transform}
  .tile.flip .c{animation:clack .1s cubic-bezier(.3,0,.7,1)}
  @keyframes clack{0%{transform:translateY(2%) scaleY(.55)}100%{transform:translateY(2%) scaleY(1)}}
  /* key lock: inverse amber tile */
  .tile.amber{background:linear-gradient(180deg,#ffc85e 0%,var(--amber) 49%,#e89a18 51%,#d68d12 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.25),
      0 10px 30px rgba(255,176,46,.25)}
  .tile.amber .c{color:var(--amberInk)}
  /* cancelled: dim red tile */
  .tile.dead{background:linear-gradient(180deg,#2a1614 0%,#241211 49%,#1d0e0d 51%,#180c0b 100%)}
  .tile.dead .c{color:var(--red);opacity:.9}
  /* key word frame */
  .wgroup .frame{position:absolute;inset:-12px;border:3px solid var(--amber);
    border-radius:14px;opacity:0;transform:scale(1.06);pointer-events:none;
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,1.2,.3,1)}
  .wgroup.keylock .frame{opacity:1;transform:scale(1)}
  /* cancelled tag */
  .wgroup .xtag{position:absolute;top:-52px;right:-4px;font-family:'Noto Sans TC',sans-serif;
    font-weight:700;font-size:27px;color:var(--red);letter-spacing:.24em;white-space:nowrap;
    opacity:0;transition:opacity .6s ease}
  .wgroup.cancelled .xtag{opacity:1}

  /* ---------- note strip ---------- */
  #note{position:absolute;left:50%;transform:translateX(-50%);display:flex;
    align-items:center;gap:20px;opacity:0;transition:opacity 1s ease;white-space:nowrap}
  .landscape #note{bottom:104px}.portrait #note{bottom:340px}
  #note.on{opacity:1}
  #note .arr{color:var(--amber);font-family:'Inter';font-size:26px}
  #note .txt{font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:28px;
    color:var(--dim);letter-spacing:.2em}
  .meta{position:absolute;font-family:'Inter','Noto Sans TC',sans-serif;font-weight:700;
    font-size:18px;letter-spacing:.26em;color:#3c424c;opacity:0;transition:opacity 1.2s}
  .meta.on{opacity:1}
  .landscape #metaBL{bottom:98px;left:130px}.landscape #metaBR{bottom:98px;right:130px}
  .portrait #metaBL{bottom:120px;left:76px}.portrait #metaBR{bottom:120px;right:76px}

  #cd{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--board)}
  #cd span{font-family:'Inter',sans-serif;font-weight:700;font-size:300px;color:var(--char)}
  #cues{position:absolute;right:24px;top:24px;z-index:21;display:none;background:rgba(10,12,16,.95);
    color:#f2f0e6;font-family:monospace;font-size:15px;line-height:1.75;
    padding:14px 18px;max-height:70%;overflow:auto;border:1px solid #262b34}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="camera">
    <div id="wall"></div>
    <div id="head"><div class="dep"></div><div class="clk"></div></div>
    <div id="rule"></div>
    <div id="board"></div>
    <div id="note"><span class="arr">▸</span><span class="txt"></span></div>
    <div class="meta" id="metaBL"></div><div class="meta" id="metaBR"></div>
  </div>
</div></div>

<script>
/* ============================================================
   CONFIG — Split-flap 翻牌看板 (departure board · EXPLORATION)
   Every character is a mechanical flap tile: it CLATTERS through
   random characters and locks with a clack. Reading order =
   arrival order. The board never fades — it flips.
   word flags: out:true (after landing, the word re-flips to red
                         dashes + 已取消 tag = the strike)
               key:true (after everything lands, the word
                         re-shuffles and locks INVERSE AMBER,
                         tile by tile, + amber frame)
   Ambient: a random tile re-adjusts itself every few seconds.
   ============================================================ */
const CONFIG = {
  orientation: "landscape",
  header: "出發",
  headerEn: "DEPARTURES",
  clock: "auto",
  lines: [
    [ {t:"別再"}, {t:"等風向", out:true} ],
    [ {t:"你就是"}, {t:"風向", key:true} ]
  ],
  cancelTag: "已取消",
  note: "下一班靈感 · 準時出發",
  metaBL: "PLATFORM 10",
  metaBR: "TAIPEI CENTRAL",
  timing: { start: 1.1, rowGap: 1.3, tileStagger: 0.09 }
};
/* ============================================================ */
const $=q=>document.querySelector(q);
const stagePx=()=>CONFIG.orientation==="portrait"?[1080,1920]:[1920,1080];
document.body.parentElement.className=CONFIG.orientation;
function fit(){const[W,H]=stagePx();const s=Math.min(innerWidth/W,innerHeight/H);
  $("#fit").style.cssText=`position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;`+
  `transform:translate(-50%,-50%) scale(${s});`;}
addEventListener("resize",fit);fit();

const CUES=[];const cue=(t,l)=>CUES.push([t,l]);
(function(){const st=document.getElementById("stage");
 const cd=document.createElement("div");cd.id="cd";cd.innerHTML="<span></span>";st.appendChild(cd);
 const cp=document.createElement("div");cp.id="cues";st.appendChild(cp);
 addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){let n=3;cd.style.display="flex";
    const s=cd.querySelector("span");s.textContent=n;
    const iv=setInterval(()=>{n--;if(n<1){clearInterval(iv);location.reload();}else s.textContent=n;},700);}
  if(e.key==="o"||e.key==="O"){boardClear();}
  if(e.key==="s"||e.key==="S"){
    cp.innerHTML="<b>SFX CUE SHEET（秒）</b><br>"+CUES.slice().sort((a,b)=>a[0]-b[0])
      .map(c=>c[0].toFixed(2)+"s — "+c[1]).join("<br>");
    cp.style.display=cp.style.display==="block"?"none":"block";}});})();

/* char pool for the shuffle */
const POOL=("的一是在不了有人我他台北車站機場出發到達準時延誤風向靈感開拍剪輯"+
  "0123456789ABCDEFGHKMNPRSTWY").split("");
const allText=CONFIG.lines.flat().map(w=>w.t).join("");
[...allText].forEach(c=>{if(!POOL.includes(c))POOL.push(c);});
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* tile size from longest row */
const rowLens=CONFIG.lines.map(l=>l.reduce((s,w)=>s+[...w.t].length,0)+ (l.length-1)*0.34);
const maxLen=Math.max(...rowLens);
const isP=CONFIG.orientation==="portrait";
const TS=Math.min(isP?150:170,Math.floor((isP?920:1620)/maxLen));
document.documentElement.style.setProperty("--ts",TS+"px");

/* build */
const board=$("#board");const groups=[];let ambientTiles=[];
CONFIG.lines.forEach(line=>{
  const row=document.createElement("div");row.className="row";
  line.forEach((w,wi)=>{
    if(wi>0){const g=document.createElement("div");g.className="wgap";row.appendChild(g);}
    const grp=document.createElement("div");grp.className="wgroup";
    grp._tiles=[];grp._flags=w;
    [...w.t].forEach(ch=>{
      const tl=document.createElement("div");tl.className="tile";
      const c=document.createElement("span");c.className="c";c.textContent="";
      tl.appendChild(c);tl._c=c;tl._target=ch;
      grp.appendChild(tl);grp._tiles.push(tl);});
    if(w.key){const f=document.createElement("div");f.className="frame";grp.appendChild(f);}
    if(w.out){const x=document.createElement("div");x.className="xtag";
      x.textContent=CONFIG.cancelTag;grp.appendChild(x);}
    row.appendChild(grp);groups.push(grp);});
  board.appendChild(row);});
$("#head .dep").innerHTML=CONFIG.header+"<span class=\"en\">"+CONFIG.headerEn+"</span>";
$("#note .txt").textContent=CONFIG.note;
$("#metaBL").textContent=CONFIG.metaBL;$("#metaBR").textContent=CONFIG.metaBR;
(function(){const el=$("#head .clk");
  if(CONFIG.clock!=="auto"){el.textContent=CONFIG.clock;return;}
  const tick=()=>{const d=new Date();
    el.textContent=String(d.getHours()).padStart(2,"0")+":"+
      String(d.getMinutes()).padStart(2,"0");};
  tick();setInterval(tick,15000);})();

/* the mechanical flip: decelerating char shuffle with clack flutter */
function flipTo(tile,target,steps,cls){
  let n=0,delay=52;
  (function step(){
    tile.classList.remove("flip");void tile.offsetWidth;tile.classList.add("flip");
    if(n>=steps){tile._c.textContent=target;
      if(cls)tile.classList.add(cls);return;}
    tile._c.textContent=rnd(POOL);n++;delay*=1.14;
    setTimeout(step,delay);})();}

/* O = outro: the board clears — every tile cascades back to blank */
function boardClear(){
  const tiles=[...document.querySelectorAll(".tile")];
  tiles.forEach((tl,i)=>setTimeout(()=>{
    tl.classList.remove("amber","dead");
    flipTo(tl,"",3+Math.floor(Math.random()*3));},i*55));
  document.querySelectorAll(".wgroup").forEach(g=>g.classList.remove("keylock","cancelled"));
  setTimeout(()=>{$("#note").style.opacity=0;
    document.querySelectorAll(".meta").forEach(m=>m.style.opacity=0);},tiles.length*55+400);}

document.fonts.ready.then(()=>{fit();
  const T=CONFIG.timing;let t=T.start;
  cue(.3,"機械環境音 vestibule hum（墊底）");
  cue(.4,"叮咚 station chime：看板亮起");
  setTimeout(()=>{$("#head").classList.add("on");$("#rule").classList.add("on");},400);
  document.querySelectorAll(".meta").forEach(m=>setTimeout(()=>m.classList.add("on"),700));
  let keyGrp=null,outGrp=null;
  /* rows flip in reading order */
  CONFIG.lines.forEach((line,ri)=>{
    cue(t,"嗒嗒嗒嗒 flap clatter：第 "+(ri+1)+" 行翻牌");
    let rowTileIdx=0;
    const startIdx=CONFIG.lines.slice(0,ri).reduce((s,l)=>s+l.length,0);
    for(let gi=startIdx;gi<startIdx+line.length;gi++){
      const grp=groups[gi];
      grp._tiles.forEach(tl=>{
        setTimeout(()=>flipTo(tl,tl._target,7+Math.floor(Math.random()*5)),
          (t+rowTileIdx*T.tileStagger)*1000);
        rowTileIdx++;});
      if(grp._flags.key)keyGrp=grp;
      if(grp._flags.out)outGrp=grp;}
    t+=rowTileIdx*T.tileStagger+T.rowGap;});
  /* the cancellation */
  if(outGrp){const tO=t+.4;
    cue(tO,"咚＋短促嗒嗒 hard clack：整組翻成紅色──＋已取消");
    outGrp._tiles.forEach((tl,i)=>setTimeout(()=>{
      flipTo(tl,"—",4,"dead");},(tO+i*.12)*1000));
    setTimeout(()=>outGrp.classList.add("cancelled"),(tO+outGrp._tiles.length*.12+.3)*1000);
    t=tO+outGrp._tiles.length*.12+.7;}
  /* the amber lock */
  if(keyGrp){const tK=t+.4;
    cue(tK,"嗒嗒…咔！tile relock：關鍵字逐格鎖定琥珀");
    keyGrp._tiles.forEach((tl,i)=>setTimeout(()=>{
      flipTo(tl,tl._target,4,"amber");},(tK+i*.16)*1000));
    const tF=tK+keyGrp._tiles.length*.16+.35;
    cue(tF,"低音 thunk：琥珀框合上");
    setTimeout(()=>keyGrp.classList.add("keylock"),tF*1000);
    t=tF+.4;}
  cue(t+.3,"叮：狀態列浮現");
  setTimeout(()=>$("#note").classList.add("on"),(t+.3)*1000);
  /* ambient: a random settled tile re-adjusts itself */
  setTimeout(()=>{ambientTiles=[...document.querySelectorAll(".tile:not(.dead):not(.amber)")];
    setInterval(()=>{const tl=rnd(ambientTiles);
      if(tl&&tl._c.textContent)flipTo(tl,tl._target,2);},3800);},(t+1)*1000);});
</script>
</body>
</html>
