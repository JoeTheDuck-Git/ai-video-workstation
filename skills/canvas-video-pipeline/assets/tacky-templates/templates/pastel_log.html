<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Pastel Code 粉彩程式・提交紀錄卡 — Tacky Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#f2efe7;--card:#fbf9f3;--ink:#3d3629;--soft:#9a917e;
        --coral:#d97757;--coralbg:#f6ddd0;--sage:#a9c3a2;--sky:#a9c4de;
        --lav:#c7b5d8;--rule:#e5dfd0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#e9e5da;overflow:hidden}
  #fit{position:absolute}
  #stage{position:relative;overflow:hidden;background:var(--ivory)}
  .landscape #stage{width:1920px;height:1080px}
  .portrait  #stage{width:1080px;height:1920px}
  #camera{position:absolute;inset:0;will-change:transform}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
  #blobA{width:760px;height:760px;background:var(--lav);top:-260px;left:-160px;
    animation:driftA 29s ease-in-out infinite alternate}
  #blobB{width:640px;height:640px;background:var(--sage);bottom:-240px;right:-140px;
    animation:driftB 25s ease-in-out infinite alternate}
  @keyframes driftA{to{transform:translate(80px,70px) scale(1.06)}}
  @keyframes driftB{to{transform:translate(-70px,-50px) scale(1.08)}}

  #eyebrow{position:absolute;z-index:5;left:50%;transform:translateX(-50%);opacity:0;
    font-family:'Courier Prime','Noto Sans TC',monospace;color:var(--coral);
    letter-spacing:.08em;white-space:nowrap;transition:opacity .7s}
  .landscape #eyebrow{top:110px;font-size:32px}
  .portrait  #eyebrow{top:230px;font-size:29px}
  #eyebrow.on{opacity:.95}
  #title{position:absolute;left:50%;transform:translateX(-50%);z-index:4;opacity:0;
    font-family:'Noto Serif TC',serif;font-weight:900;color:var(--ink);white-space:nowrap}
  .landscape #title{top:158px;font-size:72px}
  .portrait  #title{top:290px;font-size:56px}
  #title.on{animation:floatUp .8s cubic-bezier(.16,.7,.2,1) forwards}
  @keyframes floatUp{0%{opacity:0;transform:translateX(-50%) translateY(.35em);filter:blur(5px)}
    100%{opacity:1;transform:translateX(-50%) translateY(0);filter:blur(0)}}

  /* ---------- commit graph ---------- */
  #log{position:absolute;z-index:4}
  .landscape #log{left:50%;transform:translateX(-50%);top:320px;bottom:150px;width:1120px}
  .portrait  #log{left:50%;transform:translateX(-50%);top:470px;bottom:300px;width:880px}
  #rail{position:absolute;top:26px;bottom:26px;width:5px;border-radius:3px;
    background:var(--rule);transform:scaleY(0);transform-origin:top;
    transition:transform 1.4s cubic-bezier(.3,.6,.3,1)}
  .landscape #rail{left:60px}.portrait #rail{left:44px}
  #rail.on{transform:scaleY(1)}
  #entries{position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:space-evenly}
  .commit{display:flex;align-items:center;gap:40px;opacity:0}
  .commit.on{animation:cIn .7s cubic-bezier(.16,.8,.2,1) forwards}
  @keyframes cIn{0%{opacity:0;transform:translateY(24px)}
    100%{opacity:1;transform:translateY(0)}}
  .dot{flex:0 0 auto;border-radius:50%;background:var(--card);
    border:5px solid var(--soft);box-shadow:0 0 0 6px var(--ivory)}
  .landscape .dot{width:34px;height:34px;margin-left:47px}
  .portrait  .dot{width:30px;height:30px;margin-left:33px}
  .commit.key .dot{border-color:var(--coral);background:var(--coral);
    box-shadow:0 0 0 6px var(--ivory),0 0 26px rgba(217,119,87,.45)}
  .hash{font-family:'Courier Prime',monospace;color:var(--soft);flex:0 0 auto;
    letter-spacing:.04em}
  .landscape .hash{font-size:32px;width:150px}
  .portrait  .hash{font-size:28px;width:130px}
  .msg{font-family:'Noto Sans TC';font-weight:700;color:var(--ink);white-space:nowrap}
  .landscape .msg{font-size:46px}
  .portrait  .msg{font-size:38px}
  .commit.key .msg{color:var(--coral)}
  .badge{font-family:'Courier Prime',monospace;color:var(--coral);background:var(--coralbg);
    border-radius:999px;padding:6px 24px;margin-left:26px;opacity:0;white-space:nowrap;
    border:1.5px solid rgba(217,119,87,.35)}
  .landscape .badge{font-size:26px}.portrait .badge{font-size:23px}
  .badge.on{animation:bIn .5s cubic-bezier(.2,1.3,.3,1) forwards}
  @keyframes bIn{0%{opacity:0;transform:translateX(-14px)}
    100%{opacity:1;transform:translateX(0)}}
  .commit .spark{display:inline-block;margin-left:14px;color:var(--coral);opacity:0;
    transform:scale(.2) rotate(-40deg)}
  .landscape .commit .spark{font-size:40px}
  .portrait  .commit .spark{font-size:34px}
  .commit .spark.on{animation:sparkIn .6s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes sparkIn{70%{opacity:1;transform:scale(1.15) rotate(8deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}}

  #status{position:absolute;z-index:5;font-family:'Courier Prime',monospace;
    color:var(--soft);letter-spacing:.05em;opacity:0;transition:opacity .8s}
  .landscape #status{bottom:64px;right:84px;font-size:26px}
  .portrait  #status{bottom:74px;right:64px;font-size:23px}
  #status.on{opacity:.9}
  #dots{position:absolute;z-index:5;display:flex;gap:16px;opacity:0;transition:opacity .8s}
  .landscape #dots{top:66px;left:84px}.portrait #dots{top:76px;left:64px}
  #dots.on{opacity:1}
  #dots span{width:22px;height:22px;border-radius:50%}
  #dots span:nth-child(1){background:#e8a49c}#dots span:nth-child(2){background:#f0d494}
  #dots span:nth-child(3){background:var(--sage)}
  #cd{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--ivory)}
  #cd span{font-family:'Noto Serif TC';font-weight:900;font-size:320px;color:var(--ink)}
  #cues{position:absolute;right:24px;top:24px;z-index:21;display:none;background:rgba(61,54,41,.94);
    color:var(--ivory);font-family:'Courier Prime',monospace;font-size:15px;line-height:1.75;
    padding:14px 18px;max-height:70%;overflow:auto;border-radius:14px}
  .outro #camera{transition:transform 1.1s cubic-bezier(.4,0,.6,.5),opacity 1s .1s;
    transform:translateY(-40px) scale(1.015);opacity:0}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="camera">
    <div class="blob" id="blobA"></div><div class="blob" id="blobB"></div>
    <div id="dots"><span></span><span></span><span></span></div>
    <div id="eyebrow"></div>
    <div id="title"></div>
    <div id="log"><div id="rail"></div><div id="entries"></div></div>
    <div id="status"></div>
  </div>
</div></div>

<script>
/* ============================================================
   CONFIG — Pastel Code 粉彩程式・提交紀錄卡 (git-commit journey).
   A story/timeline as commit history: dots pop down the rail,
   hashes are auto-generated, messages float in. Exactly ONE
   commit with key:true — the coral commit that changed
   everything; it earns a badge (default "HEAD → 現在的你")
   and a ✳. Use for 成長史, journeys, habit arcs, 轉捩點 story.
   ============================================================ */
const CONFIG = {
  orientation: "landscape",
  eyebrow: "$ git log --oneline",
  title: "頻道的成長紀錄",
  commits: [
    {msg:"初次上傳，手抖到重錄八次"},
    {msg:"觀看數個位數的三個月"},
    {msg:"改用系統化流程", key:true, badge:"HEAD → 現在的你"},
    {msg:"第一支十萬觀看"}
  ],
  status: "main ・ 4 commits",
  timing: { start: 1.4, stagger: 0.85 }
};
/* ============================================================ */
const $=q=>document.querySelector(q);
const stagePx=()=>CONFIG.orientation==="portrait"?[1080,1920]:[1920,1080];
document.body.parentElement.className=CONFIG.orientation;
function fit(){const[W,H]=stagePx();const s=Math.min(innerWidth/W,innerHeight/H);
  $("#fit").style.cssText=`position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;`+
  `transform:translate(-50%,-50%) scale(${s});`;}
addEventListener("resize",fit);fit();
const CUES=[];const cue=(t,l)=>CUES.push([t,l]);
(function(){const st=document.getElementById("stage");
 const cd=document.createElement("div");cd.id="cd";cd.innerHTML="<span></span>";st.appendChild(cd);
 const cp=document.createElement("div");cp.id="cues";st.appendChild(cp);
 addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){let n=3;cd.style.display="flex";
    const s=cd.querySelector("span");s.textContent=n;
    const iv=setInterval(()=>{n--;if(n<1){clearInterval(iv);location.reload();}else s.textContent=n;},700);}
  if(e.key==="o"||e.key==="O"){document.getElementById("stage").classList.add("outro");}
  if(e.key==="s"||e.key==="S"){
    cp.innerHTML="<b>SFX CUE SHEET（秒）</b><br>"+CUES.slice().sort((a,b)=>a[0]-b[0])
      .map(c=>c[0].toFixed(2)+"s — "+c[1]).join("<br>");
    cp.style.display=cp.style.display==="block"?"none":"block";}});})();

$("#eyebrow").textContent=CONFIG.eyebrow;
$("#title").textContent=CONFIG.title;
$("#status").textContent=CONFIG.status;
const hash=()=>Array.from({length:7},()=>"0123456789abcdef"[Math.random()*16|0]).join("");
const box=$("#entries");
CONFIG.commits.forEach(c=>{
  const d=document.createElement("div");d.className="commit"+(c.key?" key":"");
  d.innerHTML=`<span class="dot"></span><span class="hash">${hash()}</span>
    <span class="msg">${c.msg}</span>`+
    (c.key?`<span class="badge">${c.badge||"HEAD → main"}</span><span class="spark">✳</span>`:"");
  box.appendChild(d);});

document.fonts.ready.then(()=>{fit();
  cue(0,"鋪底：溫柔環境音（極輕）");
  setTimeout(()=>{$("#dots").classList.add("on");$("#status").classList.add("on");
    $("#eyebrow").classList.add("on");},400);
  setTimeout(()=>$("#title").classList.add("on"),700);
  cue(1.1,"軟 whoosh：時間軸畫下");
  setTimeout(()=>$("#rail").classList.add("on"),1100);
  const T=CONFIG.timing;
  [...box.children].forEach((row,i)=>{
    const isKey=row.classList.contains("key");
    const t=T.start+i*T.stagger;
    cue(t,"軟 pop：commit "+(i+1)+(isKey?"（關鍵提交）":""));
    if(isKey){cue(t+.5,"badge 滑入（軟 slide）");cue(t+.8,"清脆 ✳ chime");}
    setTimeout(()=>{row.classList.add("on");
      if(isKey){setTimeout(()=>row.querySelector(".badge").classList.add("on"),500);
        setTimeout(()=>row.querySelector(".spark").classList.add("on"),800);}
    },t*1000);});});
</script>
</body>
</html>
