<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>VHS 錄影帶・文字卡 — Tacky Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--crt:#0a0d10;--crt2:#11161b;--phos:#e8f4ee;--osd:#e6ecf2;
        --glow:rgba(150,230,190,.35);--pause:#3fd9a4;--warn:#ff5c5c}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #fit{position:absolute}
  #stage{position:relative;overflow:hidden;background:var(--crt);border-radius:26px}
  .landscape #stage{width:1920px;height:1080px}
  .portrait  #stage{width:1080px;height:1920px}
  #camera{position:absolute;inset:0;will-change:transform}

  /* ---------- CRT world ---------- */
  #tube{position:absolute;inset:0;background:
    radial-gradient(120% 105% at 50% 45%, var(--crt2) 0%, var(--crt) 68%, #05070a 100%)}
  #scanlines{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.5;background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.32) 0 2px, transparent 2px 4.5px)}
  #aperture{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.16;background:
    repeating-linear-gradient(90deg, rgba(255,60,60,.5) 0 1.4px, rgba(60,255,120,.5) 1.4px 2.8px,
    rgba(80,120,255,.5) 2.8px 4.2px)}
  #crtVignette{position:absolute;inset:0;z-index:8;pointer-events:none;background:
    radial-gradient(108% 96% at 50% 48%, transparent 55%, rgba(0,0,0,.55) 92%, rgba(0,0,0,.8) 100%)}
  #snow{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.10;mix-blend-mode:screen}
  /* rolling tracking band */
  #trackband{position:absolute;left:0;right:0;height:56px;z-index:6;top:-80px;opacity:0;
    background:linear-gradient(180deg, transparent, rgba(220,240,255,.10) 30%,
      rgba(255,255,255,.18) 50%, rgba(220,240,255,.10) 70%, transparent);
    filter:blur(1px)}
  #trackband.roll{animation:roll 3.2s linear}
  @keyframes roll{0%{top:-80px;opacity:1}100%{top:110%;opacity:1}}
  /* CRT power-on */
  #poweron{position:absolute;inset:0;z-index:12;background:#000;display:flex;
    align-items:center;justify-content:center}
  #poweron .beam{width:0;height:4px;background:#fff;border-radius:2px;
    box-shadow:0 0 40px 8px rgba(255,255,255,.8)}
  #poweron.go .beam{animation:beamX .34s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes beamX{0%{width:0;height:4px}70%{width:100%;height:4px}100%{width:100%;height:4px}}
  #poweron.go{animation:beamY .5s .3s cubic-bezier(.3,.7,.2,1) forwards}
  @keyframes beamY{0%{transform:scaleY(.004);opacity:1}70%{transform:scaleY(1);opacity:1}
    100%{transform:scaleY(1);opacity:0;visibility:hidden}}

  /* ---------- headline: phosphor glow + RGB ghost ---------- */
  #headWrap{position:absolute;z-index:4;left:0;right:0;display:flex;
    flex-direction:column;align-items:center;gap:.14em}
  .landscape #headWrap{top:50%;transform:translateY(-54%)}
  .portrait  #headWrap{top:50%;transform:translateY(-56%)}
  .hline{display:flex;align-items:baseline;white-space:nowrap}
  .word{font-family:'Noto Sans TC',sans-serif;font-weight:900;color:var(--phos);
    display:inline-block;opacity:0;padding:0 .045em;position:relative;
    text-shadow:0 0 14px var(--glow), 0 0 46px rgba(140,220,180,.16),
      2.5px 0 0 rgba(255,70,70,.5), -2.5px 0 0 rgba(60,190,255,.5)}
  .landscape .word{font-size:142px;line-height:1.22}
  .portrait  .word{font-size:110px;line-height:1.26}
  .word.on{animation:tunein .5s steps(6,end) forwards}
  @keyframes tunein{
    0%{opacity:0;transform:translateX(-22px) skewX(-6deg)}
    18%{opacity:.7;transform:translateX(16px) skewX(4deg)}
    36%{opacity:.4;transform:translateX(-10px) skewX(-2deg)}
    54%{opacity:1;transform:translateX(6px) skewX(1deg)}
    72%{opacity:.85;transform:translateX(-3px)}
    100%{opacity:1;transform:translateX(0) skewX(0)}}
  /* key word: tracking-glitch lock + pause bar */
  .word.keyword{color:#fff}
  .word.keyword.locked{text-shadow:0 0 18px rgba(180,255,220,.55),0 0 70px rgba(120,255,190,.25),
    3px 0 0 rgba(255,70,70,.55), -3px 0 0 rgba(60,190,255,.55)}
  .word.keyword::after{content:"";position:absolute;left:.02em;right:.02em;bottom:-.10em;
    height:.09em;background:var(--pause);opacity:0;
    box-shadow:0 0 18px var(--pause)}
  .word.keyword.locked::after{opacity:.95;animation:pauseflick 1.1s steps(2) 2}
  @keyframes pauseflick{0%,60%{opacity:.95}61%,100%{opacity:.5}}
  .word .slice{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none}
  /* rejected word: eaten by static */
  .word .staticbox{position:absolute;inset:-4% -2%;opacity:0;z-index:2}
  .word.eaten{color:rgba(232,244,238,.16);text-shadow:none}
  .word .staticbox.on{opacity:.9}

  /* ---------- camcorder OSD ---------- */
  .osd{position:absolute;z-index:9;font-family:'VT323',monospace;color:var(--osd);
    text-shadow:0 0 8px rgba(200,230,255,.5), 1.5px 0 0 rgba(255,80,80,.35),
      -1.5px 0 0 rgba(80,180,255,.35);
    letter-spacing:.06em;opacity:0;transition:opacity .5s}
  .osd.on{opacity:.92}
  .landscape #osdTL{top:64px;left:86px;font-size:44px}
  .landscape #osdTR{top:64px;right:86px;font-size:44px;text-align:right}
  .landscape #osdBL{bottom:64px;left:86px;font-size:38px}
  .landscape #osdBR{bottom:64px;right:86px;font-size:38px;text-align:right}
  .portrait #osdTL{top:74px;left:60px;font-size:38px}
  .portrait #osdTR{top:74px;right:60px;font-size:38px;text-align:right}
  .portrait #osdBL{bottom:76px;left:60px;font-size:33px}
  .portrait #osdBR{bottom:76px;right:60px;font-size:33px;text-align:right}
  #osdTL .rec{display:inline-block;width:20px;height:20px;border-radius:50%;
    background:var(--warn);margin-right:14px;box-shadow:0 0 12px var(--warn);
    animation:blink 1.1s steps(1) infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}
  /* OSD caption tag (the VHS "tag"): types on like a camcorder title */
  #osdTag{position:absolute;z-index:9;left:50%;transform:translateX(-50%);
    font-family:'VT323','Noto Sans TC',monospace;color:var(--pause);
    text-shadow:0 0 12px rgba(63,217,164,.5);letter-spacing:.1em;white-space:nowrap}
  .landscape #osdTag{bottom:150px;font-size:52px}
  .portrait  #osdTag{bottom:300px;font-size:44px}
  #osdTag .cursor{display:inline-block;width:.5em;height:.95em;background:var(--pause);
    vertical-align:text-bottom;animation:blink 0.8s steps(1) infinite}

  /* whole-frame hsync jitter, occasional */
  #camera.hsync{animation:hsync .18s steps(3,end)}
  @keyframes hsync{0%{transform:translateX(0)}30%{transform:translateX(-14px) skewX(-1.5deg)}
    60%{transform:translateX(9px) skewX(1deg)}100%{transform:translateX(0)}}

  #cd{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--crt)}
  #cd span{font-family:'VT323',monospace;font-size:360px;color:var(--phos);
    text-shadow:0 0 30px var(--glow)}
  #cues{position:absolute;right:24px;top:24px;z-index:21;display:none;background:rgba(5,8,10,.95);
    color:var(--osd);font-family:'VT323',monospace;font-size:19px;line-height:1.6;
    padding:14px 18px;max-height:70%;overflow:auto;border:1px solid #2a3138}
  /* O = outro: CRT power-off (collapse to a line, then a dot) */
  .outro #camera{animation:crtOff .45s cubic-bezier(.6,0,.9,.4) forwards}
  @keyframes crtOff{0%{transform:scaleY(1);filter:brightness(1)}
    60%{transform:scaleY(.006);filter:brightness(2.4)}
    85%{transform:scaleY(.004) scaleX(.3);filter:brightness(3)}
    100%{transform:scaleY(.002) scaleX(0);filter:brightness(4);opacity:0}}
  .outro #scanlines,.outro #aperture{opacity:0}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="camera">
    <div id="tube"></div>
    <div id="headWrap"></div>
    <div class="osd" id="osdTL"><span class="rec"></span><span>REC</span></div>
    <div class="osd" id="osdTR">SP 0:00:00</div>
    <div class="osd" id="osdBL"></div>
    <div class="osd" id="osdBR"></div>
    <div id="osdTag"></div>
    <div id="trackband"></div>
  </div>
  <canvas id="snow"></canvas>
  <div id="aperture"></div><div id="scanlines"></div><div id="crtVignette"></div>
  <div id="poweron"><div class="beam"></div></div>
</div></div>

<script>
/* ============================================================
   CONFIG — VHS 錄影帶・文字卡 (dark CRT camcorder world).
   Emphasis vocabulary (unique to this style):
     key:true    → the word LOCKS IN through a tracking glitch,
                   then holds with phosphor glow + a PAUSE bar
     static:true → the tape EATS the word: static noise swallows
                   it and leaves a ghost (this style's strike)
   tag = camcorder OSD caption, typed on with a block cursor.
   ============================================================ */
const CONFIG = {
  orientation: "landscape",
  lines: [
    [ {t:"你以為的"}, {t:"靈感", static:true} ],
    [ {t:"其實是"}, {t:"紀律", key:true} ]
  ],
  tag: "每天同一時間開拍",
  osdBL: "AUTO WB ・ F1.8",
  osdBR: "",                    // "" = auto date like a camcorder (JUL.04 2026)
  timing: { start: 1.5, stagger: 0.42 },   // starts after CRT power-on
  hsyncEvery: 4.5                          // seconds between whole-frame jitters; 0=off
};
/* ============================================================ */
const $=q=>document.querySelector(q);
const stagePx=()=>CONFIG.orientation==="portrait"?[1080,1920]:[1920,1080];
document.body.parentElement.className=CONFIG.orientation;
function fit(){const[W,H]=stagePx();const s=Math.min(innerWidth/W,innerHeight/H);
  $("#fit").style.cssText=`position:absolute;left:50%;top:50%;width:${W}px;height:${H}px;`+
  `transform:translate(-50%,-50%) scale(${s});`;}
addEventListener("resize",fit);fit();

const CUES=[];const cue=(t,l)=>CUES.push([t,l]);
(function(){const st=document.getElementById("stage");
 const cd=document.createElement("div");cd.id="cd";cd.innerHTML="<span></span>";st.appendChild(cd);
 const cp=document.createElement("div");cp.id="cues";st.appendChild(cp);
 addEventListener("keydown",e=>{
  if(e.key==="r"||e.key==="R"){let n=3;cd.style.display="flex";
    const s=cd.querySelector("span");s.textContent=n;
    const iv=setInterval(()=>{n--;if(n<1){clearInterval(iv);location.reload();}else s.textContent=n;},700);}
  if(e.key==="o"||e.key==="O"){document.getElementById("stage").classList.add("outro");}
  if(e.key==="s"||e.key==="S"){
    cp.innerHTML="<b>SFX CUE SHEET（秒）</b><br>"+CUES.slice().sort((a,b)=>a[0]-b[0])
      .map(c=>c[0].toFixed(2)+"s — "+c[1]).join("<br>");
    cp.style.display=cp.style.display==="block"?"none":"block";}});})();

/* build words */
const wrap=$("#headWrap");const wordEls=[];
CONFIG.lines.forEach(line=>{const div=document.createElement("div");div.className="hline";
  line.forEach(w=>{const s=document.createElement("span");s.className="word";
    if(w.key)s.classList.add("keyword");
    s.textContent=w.t;s._flags=w;div.appendChild(s);wordEls.push(s);});
  wrap.appendChild(div);});
$("#osdBL").textContent=CONFIG.osdBL;
$("#osdBR").textContent=CONFIG.osdBR||
  new Date().toLocaleDateString("en-US",{month:"short",day:"2-digit",year:"numeric"})
  .toUpperCase().replace(",",".");

/* TV snow */
(function(){const c=$("#snow"),[W,H]=stagePx();c.width=W/3;c.height=H/3;
  const ctx=c.getContext("2d");c.style.cssText="position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;opacity:.10;mix-blend-mode:screen";
  (function loop(){const img=ctx.createImageData(c.width,c.height),d=img.data;
    for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=54;}
    ctx.putImageData(img,0,0);setTimeout(loop,50);})();})();

/* SP counter */
const t0=performance.now();
setInterval(()=>{const e=(performance.now()-t0)/1000;
  $("#osdTR").textContent=`SP ${Math.floor(e/3600)}:${String(Math.floor(e/60)%60).padStart(2,"0")}:${String(Math.floor(e%60)).padStart(2,"0")}`;},250);

/* occasional whole-frame hsync jitter + rolling tracking band */
if(CONFIG.hsyncEvery>0)setInterval(()=>{
  const c=$("#camera");c.classList.remove("hsync");void c.offsetWidth;c.classList.add("hsync");
},CONFIG.hsyncEvery*1000);
setInterval(()=>{const b=$("#trackband");b.classList.remove("roll");void b.offsetWidth;
  b.classList.add("roll");},7000);

/* tracking-glitch lock for the key word: slice the word into bands that
   offset horizontally for a beat, then snap into place */
function trackLock(el){
  const r=el.getBoundingClientRect();
  const slices=5, txt=el.textContent;
  el.style.visibility="hidden";
  const host=document.createElement("span");
  host.style.cssText="position:absolute;inset:0;visibility:visible";
  el.appendChild(host);
  const made=[];
  for(let i=0;i<slices;i++){
    const s=document.createElement("span");s.className="slice";
    s.style.top=(i/slices*100)+"%";s.style.height=(100/slices+.5)+"%";
    s.innerHTML=`<span style="position:absolute;left:0;top:${-i*100}%;height:${slices*100}%;
      display:flex;align-items:center;white-space:nowrap;visibility:visible">${txt}</span>`;
    s.style.transform=`translateX(${(Math.random()*46-23).toFixed(0)}px)`;
    host.appendChild(s);made.push(s);}
  let n=0;
  const iv=setInterval(()=>{n++;
    made.forEach(s=>s.style.transform=`translateX(${(Math.random()*36-18).toFixed(0)}px)`);
    if(n>=5){clearInterval(iv);
      made.forEach(s=>{s.style.transition="transform .09s steps(2)";s.style.transform="translateX(0)"});
      setTimeout(()=>{host.remove();el.style.visibility="visible";
        el.classList.add("locked");},120);}
  },70);}

/* static eats the rejected word */
function staticEat(el){
  const box=document.createElement("canvas");box.className="staticbox";
  el.appendChild(box);
  const r=el.getBoundingClientRect();
  box.width=Math.max(60,r.width/2);box.height=Math.max(30,r.height/2);
  const ctx=box.getContext("2d");
  box.style.cssText+=";width:104%;height:108%";
  let alive=true;
  (function loop(){if(!alive)return;
    const img=ctx.createImageData(box.width,box.height),d=img.data;
    for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=200;}
    ctx.putImageData(img,0,0);setTimeout(loop,45);})();
  box.classList.add("on");
  setTimeout(()=>{ // static thins out, word left as a ghost
    box.style.transition="opacity .5s";box.style.opacity=.14;
    el.classList.add("eaten");},900);}

/* timeline */
document.fonts.ready.then(()=>{fit();
  cue(0,"CRT 開機：high-pitch whine + 電流 pop");
  $("#poweron").classList.add("go");
  cue(.6,"背景鋪底：錄影帶 hiss + 馬達轉動聲（整段）");
  setTimeout(()=>{document.querySelectorAll(".osd").forEach((o,i)=>
    setTimeout(()=>o.classList.add("on"),i*90));},700);
  const T=CONFIG.timing;let t=T.start;
  wordEls.forEach(el=>{
    const f=el._flags;
    cue(t,"訊號 tune-in：字進（水平抖動）");
    if(f.static)cue(t+.6,"雜訊爆音：靜電吃掉字");
    if(f.key){cue(t+.5,"tracking 故障聲：關鍵字鎖定");cue(t+1.0,"PAUSE 嗶聲：定格條亮起");}
    setTimeout(()=>{el.classList.add("on");
      if(f.static)setTimeout(()=>staticEat(el),600);
      if(f.key)setTimeout(()=>trackLock(el),500);
    },t*1000);
    t+=T.stagger*(f.key?1.7:1);});
  // OSD caption types on
  const tag=CONFIG.tag;let ci=0;
  cue(t+.4,"打字嗶聲 ×"+tag.length+"：OSD 字幕");
  setTimeout(function type(){
    $("#osdTag").innerHTML=tag.slice(0,ci)+'<span class="cursor"></span>';
    ci++;if(ci<=tag.length)setTimeout(type,90);
    else setTimeout(()=>$("#osdTag").innerHTML=tag,900);
  },(t+.4)*1000);});
</script>
</body>
</html>
