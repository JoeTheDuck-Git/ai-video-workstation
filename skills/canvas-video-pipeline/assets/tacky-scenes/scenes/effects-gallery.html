<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Effects reel</title>
<style>
  html, body { margin: 0; background: #DCE3E8; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
  動畫特效合集：五大類、31 種效果，每段一個 demo。
  規則同 index.html：畫面只由時間 t 決定；隨機用固定種子的 PRNG。
  每個 demo 的 draw(u, D) 拿到的是「段內時間 u」與該段長度 D。
*/
const W = 1920, H = 1080, FPS = 30;

const C = {
  bg:     '#DCE3E8',
  ink:    '#14213D',
  blue:   '#2B59C3',
  amber:  '#F5A524',
  coral:  '#E4572E',
  teal:   '#1B998B',
  purple: '#7B4FD6',
  mute:   '#8A9AAE',
  grid:   '#B9C5D1',
  card:   '#F4F7FA',
};
const FONT = '"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
const S = Number(new URLSearchParams(location.search).get('scale') ?? 1); // 解析度倍率：1 = 1080p、2 = 4K
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;   // 版面座標一律用 1920×1080，輸出時整體放大
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, start, dur) => clamp((t - start) / dur);
const linear = k => k;
const easeIn = k => k * k * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const s = 1.6; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const spring = k => k <= 0 ? 0 : 1 - Math.exp(-6 * k) * Math.cos(k * 4.5 * Math.PI);

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function setFont(size, weight) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(str, x, y, { size = 48, weight = 500, color = C.ink, align = 'left', alpha = 1, baseline = 'alphabetic' } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(size, weight);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function card(x, y, w, h, { fill = C.card, alpha = 1, r = 20, stroke = null } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  rrect(x, y, w, h, r);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.stroke(); }
  ctx.restore();
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

// 舞台：轉場與氛圍類 demo 用的畫框
const FX = 260, FY = 310, FW = 1400, FH = 620;
function clipFrame() { rrect(FX, FY, FW, FH, 24); ctx.clip(); }

// 雷達圖（形狀變形 demo 用）
function radarPt(cx, cy, R, k, v) { const a = -Math.PI / 2 + k * Math.PI * 2 / 5; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; }
function radarPoly(cx, cy, R, vals) {
  ctx.beginPath();
  vals.forEach((v, k) => { const [x, y] = radarPt(cx, cy, R, k, v); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
}

// 長條圖共用：回傳每根的 x
function barLayout(n, w = 130, gap = 70) {
  const total = n * w + (n - 1) * gap, x0 = 960 - total / 2;
  return Array.from({ length: n }, (_, i) => x0 + i * (w + gap));
}
const BASE_Y = 860, BAR_MAX = 440;

// ---------- demo 清單 ----------
const CATS = {
  enter: { name: '出場／進場', color: C.blue },
  data:  { name: '數據圖表',   color: C.amber },
  trans: { name: '轉場',       color: C.coral },
  amb:   { name: '氛圍／裝飾', color: C.teal },
  ease:  { name: '動作手感',   color: C.purple },
};
const DEMOS = [];
const add = (cat, name, desc, dur, draw) => DEMOS.push({ cat, name, desc, dur, draw });

// ===== 出場／進場 =====
add('enter', '淡入淡出', '透明度漸變，所有元素的基本款', 2.6, (u, D) => {
  const a = Math.min(easeOut(prog(u, 0.15, 0.8)), 1 - easeInOut(prog(u, D - 0.9, 0.6)));
  card(660, 470, 600, 260, { alpha: a });
  text('Hello', 960, 640, { size: 110, weight: 900, align: 'center', alpha: a });
});

add('enter', '滑入', '從旁邊滑進來，搭配淡入；多個元素錯開時間', 2.6, u => {
  [C.blue, C.amber, C.coral].forEach((col, i) => {
    const k = easeOut(prog(u, 0.2 + i * 0.18, 0.7));
    if (k <= 0) return;
    ctx.save();
    ctx.translate(-(1 - k) * 240, 0);
    const x = 330 + i * 450;
    card(x, 470, 360, 280, { alpha: k });
    ctx.globalAlpha = k;
    circle(x + 90, 570, 44, col);
    text(`卡片 ${i + 1}`, x + 160, 585, { size: 48, weight: 900 });
    ctx.fillStyle = C.grid;
    rrect(x + 46, 660, 268, 20, 10); ctx.fill();
    rrect(x + 46, 700, 180, 20, 10); ctx.fill();
    ctx.restore();
  });
});

add('enter', '彈跳放大', '放大時稍微超過再彈回，適合重點數字', 2.6, u => {
  [0, 1, 2].forEach(i => {
    const k = backOut(prog(u, 0.25 + i * 0.25, 0.6));
    if (k <= 0) return;
    ctx.save();
    ctx.translate(560 + i * 400, 620);
    ctx.scale(k, k);
    circle(0, 0, 150, [C.blue, C.amber, C.coral][i]);
    text(['99', 'A+', '#1'][i], 0, 0, { size: 120, weight: 900, color: C.card, align: 'center', baseline: 'middle' });
    ctx.restore();
  });
});

add('enter', '從中心長出', '從 0 縮放到原尺寸，適合網格、圓餅、圖示', 2.6, u => {
  [100, 80, 60, 40, 20].forEach((lv, i) => {
    const k = easeOut(prog(u, 0.2 + (4 - i) * 0.12, 0.8));
    if (k <= 0) return;
    ctx.beginPath();
    for (let a = 0; a < 6; a++) {
      const ang = -Math.PI / 2 + a * Math.PI / 3, r = 300 * lv / 100 * k;
      const x = 960 + Math.cos(ang) * r, y = 620 + Math.sin(ang) * r;
      a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = hexA(C.blue, 0.06 + i * 0.04); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = C.blue; ctx.stroke();
  });
});

add('enter', '遮罩揭露', '用裁切框讓文字從底線冒出來', 2.6, u => {
  const str = '遮罩揭露效果', size = 160;
  setFont(size, 900);
  const widths = [...str].map(ch => ctx.measureText(ch).width);
  let x = 960 - widths.reduce((a, b) => a + b, 0) / 2;
  const baseY = 680;
  [...str].forEach((ch, i) => {
    const k = easeOut(prog(u, 0.2 + i * 0.08, 0.55));
    ctx.save();
    ctx.beginPath(); ctx.rect(0, baseY - size * 1.05, W, size * 1.3); ctx.clip();
    text(ch, x, baseY + (1 - k) * size * 1.2, { size, weight: 900 });
    ctx.restore();
    x += widths[i];
  });
  ctx.fillStyle = C.amber;
  ctx.fillRect(960 - 500, baseY + 50, 1000 * easeOut(prog(u, 0.9, 0.8)), 12);
});

add('enter', '描邊繪製', '線條像筆畫一樣被畫出來', 2.6, u => {
  const k1 = easeInOut(prog(u, 0.15, 1.0));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 18; ctx.strokeStyle = C.blue;
  ctx.beginPath(); ctx.arc(960, 620, 220, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k1); ctx.stroke();
  // 打勾：兩段折線，依進度畫到一半
  const k2 = easeOut(prog(u, 1.0, 0.6));
  const P = [[860, 625], [935, 700], [1075, 545]];
  const L1 = Math.hypot(P[1][0] - P[0][0], P[1][1] - P[0][1]), L2 = Math.hypot(P[2][0] - P[1][0], P[2][1] - P[1][1]);
  let d = (L1 + L2) * k2;
  if (d > 0) {
    ctx.strokeStyle = C.amber; ctx.lineWidth = 26;
    ctx.beginPath(); ctx.moveTo(...P[0]);
    const s = Math.min(d, L1) / L1;
    ctx.lineTo(lerp(P[0][0], P[1][0], s), lerp(P[0][1], P[1][1], s));
    if (d > L1) { const s2 = (d - L1) / L2; ctx.lineTo(lerp(P[1][0], P[2][0], s2), lerp(P[1][1], P[2][1], s2)); }
    ctx.stroke();
  }
});

add('enter', '打字機', '一個字一個字出現，加上閃爍游標', 3.0, u => {
  const str = '一格一格，畫出一支影片。', size = 96;
  const n = Math.floor(clamp((u - 0.2) / 0.13, 0, str.length));
  setFont(size, 700);
  const x0 = 960 - ctx.measureText(str).width / 2;
  const shown = str.slice(0, n);
  text(shown, x0, 650, { size, weight: 700 });
  const typing = n < str.length && u > 0.2;
  if (typing || Math.floor(u * 2.5) % 2 === 0) {
    setFont(size, 700);
    ctx.fillStyle = C.blue;
    ctx.fillRect(x0 + ctx.measureText(shown).width + 8, 560, 8, 110);
  }
});

add('enter', '逐字彈出', '每個字依序彈出，可加一點旋轉', 2.6, u => {
  const str = '逐字彈出！', size = 170;
  setFont(size, 900);
  const widths = [...str].map(ch => ctx.measureText(ch).width);
  let x = 960 - widths.reduce((a, b) => a + b, 0) / 2;
  [...str].forEach((ch, i) => {
    const k = backOut(prog(u, 0.2 + i * 0.12, 0.5));
    if (k > 0) {
      ctx.save();
      ctx.translate(x + widths[i] / 2, 620);
      ctx.rotate((1 - k) * -0.4);
      ctx.scale(k, k);
      text(ch, 0, 0, { size, weight: 900, color: i % 2 ? C.blue : C.ink, align: 'center', baseline: 'middle' });
      ctx.restore();
    }
    x += widths[i];
  });
});

// ===== 數據圖表 =====
add('data', '數字滾動', '數字從 0 往上數到目標值', 2.6, u => {
  const k = easeOut(prog(u, 0.2, 1.7));
  const n = Math.round(12345 * k);
  text(n.toLocaleString('en-US'), 960, 660, { size: 220, weight: 900, align: 'center' });
  text('訂閱人數', 960, 760, { size: 44, color: C.mute, align: 'center' });
  ctx.fillStyle = C.amber;
  ctx.fillRect(660, 790, 600 * k, 10);
});

const BARS = [62, 85, 48, 93, 70];
add('data', '長條生長', '長條從 0 長到數值，依序錯開', 2.6, u => {
  const xs = barLayout(BARS.length);
  ctx.fillStyle = C.mute; ctx.fillRect(xs[0] - 40, BASE_Y, xs.at(-1) + 170 - xs[0], 4);
  BARS.forEach((v, i) => {
    const k = easeOut(prog(u, 0.2 + i * 0.12, 0.9));
    const h = BAR_MAX * v / 100 * k;
    rrect(xs[i], BASE_Y - h, 130, h, 10); ctx.fillStyle = C.blue; ctx.fill();
    if (k > 0) text(String(Math.round(v * k)), xs[i] + 65, BASE_Y - h - 18, { size: 40, weight: 900, align: 'center' });
    text(`Q${i + 1}`, xs[i] + 65, BASE_Y + 50, { size: 32, color: C.mute, align: 'center' });
  });
});

add('data', '形狀變形', '一組數據平滑變成另一組', 3.0, u => {
  const S = [[0, 0, 0, 0, 0], [80, 60, 90, 50, 70], [50, 95, 60, 88, 55], [92, 70, 52, 62, 95]];
  const cx = 960, cy = 620, R = 270;
  [20, 40, 60, 80, 100].forEach(lv => {
    radarPoly(cx, cy, R, [lv, lv, lv, lv, lv]);
    ctx.lineWidth = 2; ctx.strokeStyle = C.grid; ctx.stroke();
  });
  let seg = 0;
  [0.2, 1.0, 1.9].forEach((s, i) => { if (u >= s) seg = i; });
  const s = [0.2, 1.0, 1.9][seg];
  const vals = S[seg + 1].map((v, k) => lerp(S[seg][k], v, easeInOut(prog(u, s + k * 0.04, 0.55))));
  radarPoly(cx, cy, R, vals);
  ctx.fillStyle = hexA(C.blue, 0.25); ctx.fill();
  ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = C.blue; ctx.stroke();
  text(['方案 A', '方案 B', '方案 C'][seg], 1400, 640, { size: 56, weight: 900, baseline: 'middle' });
});

// 排名賽跑資料：每季數值
const RACE = [
  { name: 'A 牌', color: C.blue,   v: [20, 45, 60, 70] },
  { name: 'B 牌', color: C.amber,  v: [35, 40, 75, 85] },
  { name: 'C 牌', color: C.coral,  v: [50, 55, 58, 62] },
  { name: 'D 牌', color: C.teal,   v: [10, 50, 65, 95] },
  { name: 'E 牌', color: C.purple, v: [30, 35, 40, 50] },
];
const raceVals = q => RACE.map(r => { const i = Math.min(Math.floor(q), 2); return lerp(r.v[i], r.v[i + 1], easeInOut(clamp(q - i))); });
const raceRankY = q => {
  const vals = raceVals(q), order = vals.map((v, i) => i).sort((a, b) => vals[b] - vals[a]);
  const y = []; order.forEach((idx, r) => { y[idx] = 400 + r * 100; });
  return y;
};
add('data', '排名賽跑', '數值隨時間變化，名次互相超車', 4.2, u => {
  const q = clamp((u - 0.3) / 3.3) * 3;
  const vals = raceVals(q);
  // 名次換位要滑順：把最近 0.3 秒內的排名位置取平均（仍是 t 的純函式）
  const ys = RACE.map(() => 0), N = 9;
  for (let s = 0; s < N; s++) {
    const qs = clamp((u - 0.3 - s * 0.035) / 3.3) * 3;
    raceRankY(qs).forEach((y, i) => { ys[i] += y / N; });
  }
  RACE.forEach((r, i) => {
    const w = 1000 * vals[i] / 100;
    text(r.name, 440, ys[i] + 40, { size: 36, weight: 700, align: 'right', baseline: 'middle' });
    rrect(470, ys[i] + 10, w, 60, 10); ctx.fillStyle = r.color; ctx.fill();
    text(String(Math.round(vals[i])), 470 + w + 16, ys[i] + 40, { size: 36, weight: 900, baseline: 'middle' });
  });
  text(`第 ${Math.min(4, Math.floor(q) + 1)} 季`, 1700, 880, { size: 80, weight: 900, color: C.grid, align: 'right' });
});

const LINE = [30, 42, 38, 55, 50, 68, 74, 88];
add('data', '折線描繪', '折線從左到右畫出來，標記點跟著出現', 2.8, u => {
  const x0 = 360, x1 = 1560, y0 = 860, y1 = 400;
  const P = LINE.map((v, i) => [lerp(x0, x1, i / (LINE.length - 1)), lerp(y0, y1, v / 100)]);
  ctx.fillStyle = C.mute; ctx.fillRect(x0, y0, x1 - x0, 4);
  const k = easeInOut(prog(u, 0.2, 1.9));
  const headX = lerp(x0, x1, k);
  // 面積
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, headX, H); ctx.clip();
  ctx.beginPath(); ctx.moveTo(x0, y0); P.forEach(p => ctx.lineTo(...p)); ctx.lineTo(x1, y0); ctx.closePath();
  ctx.fillStyle = hexA(C.blue, 0.15); ctx.fill();
  ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p));
  ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = C.blue; ctx.stroke();
  ctx.restore();
  P.forEach(([x, y], i) => {
    const a = easeOut(clamp((headX - x) / 60));
    if (a <= 0) return;
    circle(x, y, 11 * a, C.card);
    ctx.lineWidth = 5; ctx.strokeStyle = C.blue; ctx.stroke();
    text(String(LINE[i]), x, y - 30, { size: 30, weight: 700, align: 'center', alpha: a });
  });
  // 筆頭
  if (k > 0 && k < 1) {
    const seg = Math.min(Math.floor(k * (P.length - 1)), P.length - 2), f = k * (P.length - 1) - seg;
    circle(lerp(P[seg][0], P[seg + 1][0], f), lerp(P[seg][1], P[seg + 1][1], f), 14, C.amber);
  }
});

const PIE = [[35, C.blue], [25, C.amber], [20, C.coral], [12, C.teal], [8, C.purple]];
add('data', '環形展開', '扇形依序轉出來', 2.8, u => {
  const k = easeInOut(prog(u, 0.2, 1.5));
  const cx = 960, cy = 620, R = 240;
  let acc = 0;
  PIE.forEach(([v, col]) => {
    const a0 = acc / 100, a1 = Math.min((acc + v) / 100, k);
    acc += v;
    if (a1 <= a0) return;
    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI / 2 + a0 * Math.PI * 2, -Math.PI / 2 + a1 * Math.PI * 2);
    ctx.lineWidth = 100; ctx.strokeStyle = col; ctx.stroke();
    // 百分比標籤：該段畫完才出現
    const la = easeOut(prog(u, 1.7, 0.4));
    const mid = -Math.PI / 2 + (a0 + v / 200) * Math.PI * 2;
    text(`${v}%`, cx + Math.cos(mid) * (R + 110), cy + Math.sin(mid) * (R + 110), { size: 36, weight: 900, align: 'center', baseline: 'middle', alpha: la });
  });
  text(`${Math.round(100 * k)}%`, cx, cy, { size: 80, weight: 900, align: 'center', baseline: 'middle' });
});

const FOCUS = [55, 72, 48, 93, 66, 80];
add('data', '重點聚焦', '其他元素變暗，只亮出重點那一項', 2.8, u => {
  const xs = barLayout(FOCUS.length, 120, 60);
  const f = easeInOut(prog(u, 1.0, 0.5));
  ctx.fillStyle = C.mute; ctx.fillRect(xs[0] - 40, BASE_Y, xs.at(-1) + 160 - xs[0], 4);
  FOCUS.forEach((v, i) => {
    const k = easeOut(prog(u, 0.1 + i * 0.06, 0.6));
    const h = BAR_MAX * v / 100 * k, hot = i === 3;
    ctx.save();
    ctx.globalAlpha *= hot ? 1 : lerp(1, 0.25, f);
    rrect(xs[i], BASE_Y - h, 120, h, 10);
    ctx.fillStyle = hot && f > 0 ? C.amber : C.blue; ctx.fill();
    ctx.restore();
  });
  const p = backOut(prog(u, 1.3, 0.5));
  if (p > 0) {
    const x = xs[3] + 60, y = BASE_Y - BAR_MAX * 0.93 - 70;
    ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
    card(-110, -45, 220, 90, { fill: C.ink, r: 45 });
    text('最高 93', 0, 2, { size: 40, weight: 900, color: C.card, align: 'center', baseline: 'middle' });
    ctx.restore();
  }
});

const REF = [55, 72, 48, 90, 66, 80];
add('data', '對照標線', '畫出平均線，超過的部分變色', 2.8, u => {
  const xs = barLayout(REF.length, 120, 60);
  const avg = REF.reduce((a, b) => a + b, 0) / REF.length;
  const ly = BASE_Y - BAR_MAX * avg / 100;
  const lk = easeInOut(prog(u, 0.9, 0.8));
  const lx0 = xs[0] - 40, lx1 = xs.at(-1) + 160, lineX = lerp(lx0, lx1, lk);
  ctx.fillStyle = C.mute; ctx.fillRect(lx0, BASE_Y, lx1 - lx0, 4);
  REF.forEach((v, i) => {
    const k = easeOut(prog(u, 0.1 + i * 0.06, 0.6));
    const h = BAR_MAX * v / 100 * k;
    const above = v > avg && lineX > xs[i] + 60;
    rrect(xs[i], BASE_Y - h, 120, h, 10);
    ctx.fillStyle = above ? C.blue : C.grid; ctx.fill();
  });
  if (lk > 0) {
    ctx.setLineDash([18, 12]); ctx.lineWidth = 5; ctx.strokeStyle = C.coral;
    ctx.beginPath(); ctx.moveTo(lx0, ly); ctx.lineTo(lineX, ly); ctx.stroke(); ctx.setLineDash([]);
    text(`平均 ${avg.toFixed(1)}`, lx1 + 20, ly, { size: 36, weight: 900, color: C.coral, baseline: 'middle', alpha: easeOut(prog(u, 1.6, 0.4)) });
  }
});

// ===== 轉場 =====
const ZP = [FX + 1080, FY + 230];   // 放大穿越的目標點
function sceneA() {
  ctx.fillStyle = C.blue; ctx.fillRect(FX, FY, FW, FH);
  text('場景 A', FX + 120, FY + FH / 2, { size: 130, weight: 900, color: C.card, baseline: 'middle' });
  circle(ZP[0], ZP[1], 60, C.amber);
  ctx.fillStyle = hexA(C.card, 0.35);
  rrect(FX + 900, FY + 360, 360, 28, 14); ctx.fill();
  rrect(FX + 900, FY + 420, 240, 28, 14); ctx.fill();
}
function sceneB() {
  ctx.fillStyle = C.ink; ctx.fillRect(FX, FY, FW, FH);
  [0.5, 0.8, 0.65, 0.95].forEach((v, i) => {
    rrect(FX + 820 + i * 120, FY + FH - 100 - 380 * v, 80, 380 * v, 8);
    ctx.fillStyle = i === 3 ? C.amber : hexA(C.card, 0.3); ctx.fill();
  });
  text('場景 B', FX + 120, FY + FH / 2, { size: 130, weight: 900, color: C.amber, baseline: 'middle' });
}
const transK = u => easeInOut(prog(u, 0.6, 1.2));
function framed(fn) { ctx.save(); clipFrame(); fn(); ctx.restore(); }

add('trans', '交叉淡化', '前一段淡出、下一段淡入', 2.8, u => framed(() => {
  const k = transK(u);
  sceneA();
  ctx.globalAlpha = k; sceneB();
}));

add('trans', '推移', '整個畫面往一邊推走，換成下一頁', 2.8, u => framed(() => {
  const k = transK(u);
  ctx.save(); ctx.translate(-FW * k, 0); sceneA(); ctx.restore();
  ctx.save(); ctx.translate(FW * (1 - k), 0); sceneB(); ctx.restore();
}));

add('trans', '擦除', '一條斜色塊掃過畫面，後面換成新場景', 2.8, u => framed(() => {
  const k = transK(u);
  const slant = 260, sx = lerp(FX - slant - 140, FX + FW + 140, k);
  sceneA();
  const band = (x, w) => { ctx.beginPath(); ctx.moveTo(x - w, FY); ctx.lineTo(x, FY); ctx.lineTo(x + slant, FY + FH); ctx.lineTo(x + slant - w, FY + FH); ctx.closePath(); };
  ctx.save();
  ctx.beginPath(); ctx.moveTo(FX - slant - 200, FY); ctx.lineTo(sx - 140, FY); ctx.lineTo(sx - 140 + slant, FY + FH); ctx.lineTo(FX - slant - 200, FY + FH); ctx.closePath();
  ctx.clip(); sceneB(); ctx.restore();
  band(sx, 140); ctx.fillStyle = C.amber; ctx.fill();
}));

add('trans', '放大穿越', '鏡頭推進某個元素，進入下一個場景', 2.8, u => framed(() => {
  const k = prog(u, 0.5, 1.4);
  const s = Math.pow(40, easeIn(clamp(k / 0.8)));
  ctx.save();
  ctx.translate(ZP[0], ZP[1]); ctx.scale(s, s); ctx.translate(-ZP[0], -ZP[1]);
  sceneA();
  ctx.restore();
  ctx.globalAlpha = easeOut(prog(k, 0.55, 0.45)); sceneB();
}));

add('trans', '圓形展開', '從某一點以圓形擴散露出新畫面', 2.8, u => framed(() => {
  const k = transK(u);
  sceneA();
  const cx = ZP[0], cy = ZP[1], R = Math.hypot(Math.max(cx - FX, FX + FW - cx), Math.max(cy - FY, FY + FH - cy));
  ctx.beginPath(); ctx.arc(cx, cy, R * k, 0, Math.PI * 2); ctx.clip();
  sceneB();
}));

// ===== 氛圍／裝飾 =====
const rnd = mulberry32(20261005);
const DOTS = Array.from({ length: 160 }, () => ({
  x: rnd() * FW, y: rnd() * FH, sp: 30 + rnd() * 110, r: 2 + rnd() * 5, ph: rnd() * 6.28, col: rnd() < 0.7 ? C.card : C.amber,
}));
const CONFETTI = Array.from({ length: 90 }, () => ({
  x: rnd() * FW, delay: rnd() * 0.8, sp: 260 + rnd() * 260, rot: rnd() * 6.28, vr: (rnd() - 0.5) * 10,
  sway: 20 + rnd() * 40, w: 10 + rnd() * 12, h: 18 + rnd() * 14, col: [C.blue, C.amber, C.coral, C.teal, C.purple][Math.floor(rnd() * 5)],
}));

add('amb', '粒子', '漂浮光點與彩帶，用固定種子的隨機數，每次渲染結果都一樣', 3.2, u => framed(() => {
  ctx.fillStyle = C.ink; ctx.fillRect(FX, FY, FW, FH);
  DOTS.forEach(d => {
    const y = ((d.y - d.sp * u) % FH + FH) % FH;
    const x = d.x + Math.sin(u * 1.2 + d.ph) * 14;
    ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(u * 3 + d.ph));
    circle(FX + x, FY + y, d.r, d.col);
  });
  ctx.globalAlpha = 1;
  text('粒子', FX + FW / 2, FY + FH / 2, { size: 120, weight: 900, color: C.card, align: 'center', baseline: 'middle' });
  CONFETTI.forEach(c => {
    const tt = u - 1.0 - c.delay;
    if (tt <= 0) return;
    const y = -30 + c.sp * tt, x = c.x + Math.sin(tt * 3 + c.rot) * c.sway;
    if (y > FH + 40) return;
    ctx.save();
    ctx.translate(FX + x, FY + y); ctx.rotate(c.rot + c.vr * tt);
    ctx.scale(1, Math.cos(tt * 6 + c.rot));     // 翻面感
    ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  });
}));

add('amb', '光暈／發光', '重點元素加上會呼吸的柔和光暈', 2.8, u => framed(() => {
  ctx.fillStyle = C.ink; ctx.fillRect(FX, FY, FW, FH);
  const pulse = 0.5 + 0.5 * Math.sin(u * 4);
  ctx.save();
  ctx.shadowColor = C.amber; ctx.shadowBlur = (40 + 60 * pulse) * S;   // shadowBlur 是像素單位，不吃 transform
  circle(FX + 420, FY + FH / 2, 120, C.amber);
  circle(FX + 420, FY + FH / 2, 120, C.amber);
  ctx.restore();
  ctx.save();
  ctx.shadowColor = '#6F9BFF'; ctx.shadowBlur = (20 + 40 * (1 - pulse)) * S;
  text('GLOW', FX + 980, FY + FH / 2, { size: 180, weight: 900, color: '#CFE0FF', align: 'center', baseline: 'middle' });
  ctx.restore();
}));

add('amb', '漸層流動', '背景顏色緩慢流動，適合當背景', 3.0, u => framed(() => {
  ctx.fillStyle = '#0E1630'; ctx.fillRect(FX, FY, FW, FH);
  ctx.globalCompositeOperation = 'lighter';
  [[C.blue, 0.7, 0], [C.coral, 0.9, 2.1], [C.teal, 0.6, 4.2], [C.purple, 0.8, 1.0]].forEach(([col, sp, ph]) => {
    const x = FX + FW / 2 + Math.cos(u * sp + ph) * 480, y = FY + FH / 2 + Math.sin(u * sp * 1.3 + ph) * 200;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 520);
    g.addColorStop(0, hexA(col, 0.75)); g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g; ctx.fillRect(FX, FY, FW, FH);
  });
  ctx.globalCompositeOperation = 'source-over';
  text('漸層流動', FX + FW / 2, FY + FH / 2, { size: 120, weight: 900, color: '#FFFFFF', align: 'center', baseline: 'middle' });
}));

add('amb', '幾何背景', '網點波紋加上旋轉的幾何圖形', 3.0, u => framed(() => {
  ctx.fillStyle = C.card; ctx.fillRect(FX, FY, FW, FH);
  const cx = FX + FW / 2, cy = FY + FH / 2;
  for (let gx = FX + 25; gx < FX + FW; gx += 50) for (let gy = FY + 25; gy < FY + FH; gy += 50) {
    const d = Math.hypot(gx - cx, gy - cy);
    circle(gx, gy, 2 + 6 * (0.5 + 0.5 * Math.sin(d * 0.025 - u * 5)), hexA(C.blue, 0.35));
  }
  [200, 150, 100].forEach((r, i) => {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(u * (i % 2 ? -0.8 : 0.6));
    ctx.beginPath();
    for (let a = 0; a < 6; a++) { const ang = a * Math.PI / 3; a ? ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r) : ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r); }
    ctx.closePath(); ctx.lineWidth = 6; ctx.strokeStyle = [C.blue, C.amber, C.coral][i]; ctx.stroke();
    ctx.restore();
  });
}));

add('amb', '鏡頭微晃／推近', '緩慢推近加上輕微晃動，讓靜態畫面有呼吸感', 3.2, (u, D) => framed(() => {
  ctx.fillStyle = C.card; ctx.fillRect(FX, FY, FW, FH);
  const s = 1 + 0.12 * easeInOut(u / D);
  const dx = 7 * Math.sin(u * 1.3) + 4 * Math.sin(u * 2.9 + 1), dy = 6 * Math.sin(u * 1.7 + 2) + 3 * Math.sin(u * 3.1);
  ctx.translate(FX + FW / 2 + dx, FY + FH / 2 + dy); ctx.rotate(0.006 * Math.sin(u * 0.9)); ctx.scale(s, s);
  ctx.translate(-(FX + FW / 2), -(FY + FH / 2));
  text('慢慢靠近', FX + 140, FY + 200, { size: 96, weight: 900 });
  [C.blue, C.amber, C.coral].forEach((col, i) => {
    card(FX + 140 + i * 400, FY + 280, 340, 240, { fill: '#FFFFFF' });
    circle(FX + 230 + i * 400, FY + 370, 44, col);
    ctx.fillStyle = C.grid; rrect(FX + 190 + i * 400, FY + 440, 240, 20, 10); ctx.fill();
  });
}));

// ===== 動作手感（easing）=====
function easeDemo(fn, label) {
  return u => {
    const k = prog(u, 0.4, 1.5);
    const x0 = 300, x1 = 1120;
    // 對照組：linear
    text('linear', x0 - 30, 470, { size: 30, color: C.mute, align: 'right', baseline: 'middle' });
    ctx.fillStyle = C.grid; ctx.fillRect(x0, 468, x1 - x0, 4);
    circle(lerp(x0, x1, k), 470, 26, C.grid);
    text(label, x0 - 30, 660, { size: 30, weight: 700, color: C.purple, align: 'right', baseline: 'middle' });
    ctx.fillStyle = C.grid; ctx.fillRect(x0, 658, x1 - x0, 4);
    // 殘影：過去 0.3 秒的位置
    for (let s = 6; s >= 1; s--) {
      const ks = prog(u - s * 0.05, 0.4, 1.5);
      ctx.globalAlpha = 0.12 * (7 - s) / 6;
      circle(lerp(x0, x1, fn(ks)), 660, 44, C.purple);
    }
    ctx.globalAlpha = 1;
    circle(lerp(x0, x1, fn(k)), 660, 44, C.purple);
    // 曲線圖
    const gx = 1320, gy = 820, gw = 340, gh = 300, lo = -0.25, hi = 1.3;
    const map = (a, v) => [gx + a * gw, gy - (v - lo) / (hi - lo) * gh];
    card(gx - 30, gy - gh - 30, gw + 60, gh + 60, { fill: C.card });
    ctx.strokeStyle = C.grid; ctx.lineWidth = 2;
    [0, 1].forEach(v => { const [, y] = map(0, v); ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke(); });
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) { const [x, y] = map(i / 80, fn(i / 80)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.lineWidth = 5; ctx.strokeStyle = C.purple; ctx.stroke();
    const [px, py] = map(k, fn(k));
    circle(px, py, 12, C.amber);
  };
}
add('ease', 'easeOut', '快速出現再慢慢停下，最自然', 2.6, easeDemo(easeOut, 'easeOut'));
add('ease', 'easeInOut', '慢起慢停，適合移動和變形', 2.6, easeDemo(easeInOut, 'easeInOut'));
add('ease', 'backOut', '稍微超過目標再回彈，比較活潑', 2.6, easeDemo(backOut, 'backOut'));
add('ease', '彈簧 spring', '像彈簧一樣來回震盪幾下', 2.8, easeDemo(spring, 'spring'));

add('ease', '錯開 stagger', '一組元素依序出現，而不是同時動作', 3.0, u => {
  const n = 10, x0 = 480, gap = 120;
  text('同時', 400, 470, { size: 34, weight: 700, color: C.mute, align: 'right', baseline: 'middle' });
  text('錯開', 400, 680, { size: 34, weight: 700, color: C.purple, align: 'right', baseline: 'middle' });
  for (let i = 0; i < n; i++) {
    const a = backOut(prog(u, 0.3, 0.6));
    const b = backOut(prog(u, 0.3 + i * 0.09, 0.6));
    if (a > 0) { ctx.save(); ctx.translate(x0 + i * gap, 470); ctx.scale(a, a); circle(0, 0, 40, C.grid); ctx.restore(); }
    if (b > 0) { ctx.save(); ctx.translate(x0 + i * gap, 680 - (1 - b) * 60); ctx.scale(b, b); circle(0, 0, 40, C.purple); ctx.restore(); }
  }
});

// ---------- 時間表 ----------
const INTRO = 2.6;
let acc = INTRO;
DEMOS.forEach(d => { d.start = acc; acc += d.dur; });
const DURATION = Math.round((acc + 0.4) * FPS) / FPS;   // 結尾多 0.4 秒淡出
window.DURATION = DURATION;
window.FPS = FPS;
DEMOS.forEach((d, i) => {
  const same = DEMOS.filter(x => x.cat === d.cat);
  d.idx = same.indexOf(d) + 1; d.of = same.length; d.n = i + 1;
});

function intro(t) {
  const out = easeInOut(prog(t, INTRO - 0.4, 0.4));
  ctx.save(); ctx.globalAlpha = 1 - out;
  const k = easeOut(prog(t, 0.2, 0.7));
  text('動畫特效合集', 960, 500 + (1 - k) * 40, { size: 140, weight: 900, align: 'center', alpha: k });
  Object.values(CATS).forEach((c, i) => {
    const a = backOut(prog(t, 0.7 + i * 0.12, 0.5));
    if (a <= 0) return;
    const x = 960 + (i - 2) * 270;
    ctx.save(); ctx.translate(x, 640); ctx.scale(a, a);
    card(-120, -36, 240, 72, { fill: c.color, r: 36 });
    text(c.name, 0, 2, { size: 32, weight: 900, color: '#FFFFFF', align: 'center', baseline: 'middle' });
    ctx.restore();
  });
  text(`5 大類・${DEMOS.length} 種效果`, 960, 780, { size: 44, color: C.mute, align: 'center', alpha: easeOut(prog(t, 1.3, 0.5)) });
  ctx.restore();
}

function header(d, u, env, chipEnv) {
  const cat = CATS[d.cat];
  ctx.save();
  ctx.globalAlpha = chipEnv;
  setFont(30, 900);
  const label = `${cat.name}  ${d.idx}/${d.of}`;
  const w = ctx.measureText(label).width + 56;
  card(140, 70, w, 56, { fill: cat.color, r: 28 });
  text(label, 140 + w / 2, 99, { size: 30, weight: 900, color: '#FFFFFF', align: 'center', baseline: 'middle' });
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = env;
  ctx.translate((1 - env) * -30, 0);
  text(d.name, 140, 210, { size: 76, weight: 900 });
  text(d.desc, 140, 268, { size: 32, color: C.mute });
  ctx.restore();
}

function footer(t) {
  const x0 = 140, x1 = W - 140, y = 1010;
  ctx.fillStyle = C.grid; ctx.fillRect(x0, y, x1 - x0, 4);
  // 依類別上色的分段
  DEMOS.forEach(d => {
    const a = lerp(x0, x1, d.start / DURATION), b = lerp(x0, x1, (d.start + d.dur) / DURATION);
    const f = clamp((t - d.start) / d.dur);
    if (f > 0) { ctx.fillStyle = CATS[d.cat].color; ctx.fillRect(a, y - 1, (b - a) * f, 6); }
  });
}

// ---------- 主入口 ----------
function seek(t) {
  t = clamp(t, 0, DURATION);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  if (t < INTRO) intro(t);
  const i = DEMOS.findIndex(d => t >= d.start && t < d.start + d.dur);
  const d = DEMOS[i] ?? (t >= DEMOS.at(-1).start ? DEMOS.at(-1) : null);
  if (d) {
    const u = t - d.start;
    const fin = easeOut(prog(u, 0, 0.25)), fout = 1 - easeInOut(prog(u, d.dur - 0.25, 0.25));
    const env = Math.min(fin, fout);
    const prev = DEMOS[DEMOS.indexOf(d) - 1], next = DEMOS[DEMOS.indexOf(d) + 1];
    const chipEnv = Math.min(prev?.cat === d.cat ? 1 : fin, next?.cat === d.cat ? 1 : fout);
    header(d, u, env, chipEnv);
    ctx.save();
    ctx.globalAlpha = env;
    d.draw(u, d.dur);
    ctx.restore();
    text(`${d.n} / ${DEMOS.length}`, W - 140, 985, { size: 28, weight: 700, color: C.mute, align: 'right' });
  }
  footer(t);
  const end = prog(t, DURATION - 0.4, 0.4);
  if (end > 0) { ctx.fillStyle = hexA(C.bg, end); ctx.fillRect(0, 0, W, H); }
}
window.seek = seek;
window.ready = document.fonts.ready.then(() => true);
window.DEMO_TIMES = DEMOS.map(d => ({ name: d.name, start: +d.start.toFixed(2), dur: d.dur }));

// 預覽：render.mjs 會加上 ?render=1 關掉這段
if (!new URLSearchParams(location.search).has('render')) {
  const t0 = performance.now();
  const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  window.ready.then(loop);
} else {
  seek(0);
}
</script>
</body>
